<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ko">
<title>Quiz Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBDF;
    --paper-deep: #E4DFCF;
    --ink: #21283B;
    --ink-soft: #4B5266;
    --plum: #7A2E3B;
    --jade: #3F6E56;
    --gold: #B8933A;
    --coral: #C1592E;
    --line: #D8D2BF;
    --white: #FBFAF6;
    --danger: #B0413E;
    --ok: #3F6E56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }
  .bojagi-strip {
    height: 8px;
    width: 100%;
    background: repeating-linear-gradient(
      90deg,
      var(--plum) 0 14%,
      var(--jade) 14% 28%,
      var(--gold) 28% 42%,
      var(--ink) 42% 56%,
      var(--plum) 56% 70%,
      var(--jade) 70% 84%,
      var(--gold) 84% 100%
    );
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
  }
  h1 span { color: var(--plum); }
  .role-toggle {
    display: flex;
    gap: 8px;
  }
  .role-toggle button {
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all .15s ease;
  }
  .role-toggle button.active {
    background: var(--ink);
    color: var(--white);
  }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 18px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--jade);
    border-radius: 4px 4px 0 0;
  }
  .card.plum::before { background: var(--plum); }
  .card.gold::before { background: var(--gold); }
  .subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .subtabs button {
    flex: 1;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    color: var(--ink-soft);
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }
  .subtabs button.active {
    background: var(--white);
    color: var(--ink);
    border-color: var(--ink);
    font-weight: 700;
  }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  input[type=text], textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    border: none;
    background: var(--ink);
    color: var(--white);
    padding: 11px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }
  .btn.secondary { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn.plum { background: var(--plum); }
  .btn.jade { background: var(--jade); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .q-block {
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--paper);
  }
  .q-block .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .q-block .opt-row input[type=text] { margin-bottom: 0; }
  .q-block .del-q { align-self: flex-end; margin-top: -6px; }
  .quiz-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .quiz-row:last-child { border-bottom: none; }
  .quiz-title { font-weight: 700; }
  .quiz-meta { font-size: 12px; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 20px 0; }
  .code-display {
    text-align: center;
    padding: 24px 0;
  }
  .code-display .code {
    font-family: 'Inter', sans-serif;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 6px;
    color: var(--plum);
  }
  .code-display .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .status-pill {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .status-pill.live { background: var(--jade); color: var(--white); }
  .answer-log-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .answer-log-row:last-child { border-bottom: none; }
  .mark { font-size: 18px; width: 22px; flex-shrink: 0; }
  .mark.correct { color: var(--ok); }
  .mark.wrong { color: var(--danger); }
  .log-text { font-size: 14px; }
  .log-text .qtext { font-weight: 700; margin-bottom: 2px; }
  .log-text .picked { color: var(--ink-soft); }
  .log-text .correct-answer { color: var(--ok); }
  .score-big {
    text-align: center;
    padding: 16px 0;
  }
  .score-big .num {
    font-family: 'Inter', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: var(--jade);
  }
  .student-q-num {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .student-q-text {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 21px;
    margin-bottom: 20px;
    color: var(--ink);
  }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    transition: all .12s ease;
  }
  .opt-btn:hover { border-color: var(--ink); }
  .opt-btn.selected.ok { background: var(--jade); border-color: var(--jade); color: var(--white); }
  .opt-btn.selected.bad { background: var(--danger); border-color: var(--danger); color: var(--white); }
  .opt-btn.reveal-correct { border-color: var(--ok); }
  .opt-btn:disabled { cursor: default; }
  .feedback-line { font-size: 16px; margin-top: 6px; margin-bottom: 16px; min-height: 20px; font-weight: 700; }
  .feedback-line.pop { animation: popIn 0.35s ease; }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  .feedback-line.ok { color: var(--ok); }
  .feedback-line.bad { color: var(--danger); }
  .err { color: var(--danger); font-size: 13px; margin-top: -6px; margin-bottom: 10px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: -8px; margin-bottom: 14px; }
  .join-form { max-width: 320px; margin: 0 auto; }
  .match-wrap { position: relative; display: flex; justify-content: space-between; gap: 20px; }
  @media (max-width: 480px) {
    .match-col { flex: 0 1 44%; max-width: 44%; }
    .match-wrap { gap: 12px; }
  }
  .match-col { flex: 0 1 40%; max-width: 40%; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .match-pill {
    display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--line); border-radius: 999px;
    padding: 8px 10px; background: var(--white);
    cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif;
    width: 100%; text-align: left;
  }
  .match-pill .match-text { flex: 1; overflow-wrap: anywhere; }
  .match-badge {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--white); flex-shrink: 0;
  }
  .match-badge.left-badge { background: var(--jade); }
  .match-badge.right-badge { background: var(--coral); }
  .match-pill.selected { border-color: var(--ink); border-width: 2px; }
  .match-pill.matched-ok { border-color: var(--ok); background: #EAF3EE; cursor: default; }
  .match-pill.matched-bad { border-color: var(--danger); background: #F7E9E8; cursor: default; }
  .match-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--white); flex-shrink: 0; }
  svg.match-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  select.q-type {
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    background: var(--paper);
    color: var(--ink);
  }
  .pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mark-wrap { position: relative; line-height: 0; margin-bottom: 8px; }
  .mark-wrap img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px; }
  .mark-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; mix-blend-mode: multiply; touch-action: none; cursor: crosshair; }
  .mark-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mark-tools .hint { margin: 0; flex: 1; min-width: 160px; }
  .mark-tools .btn { padding: 5px 12px; font-size: 13px; }
  .exam-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; }
  .exam-clock { font-size: 26px; font-weight: 800; color: var(--plum); font-variant-numeric: tabular-nums; }
  .exam-nav { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .exam-nav button { font-family:'Inter',sans-serif; font-size:13px; min-width:44px; padding:7px 10px; border:1.5px solid var(--line); border-radius:4px; background:var(--white); color:var(--ink); cursor:pointer; }
  .exam-nav button.answered { background:var(--paper-deep); border-color:var(--ink-soft); }
  .exam-nav button.current { border-color:var(--ink); border-width:2px; font-weight:700; }
  .opt-btn.exam-sel { background: var(--ink); border-color: var(--ink); color: var(--white); }
  table.exam-table { width:100%; border-collapse:collapse; font-size:14px; }
  table.exam-table th, table.exam-table td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:center; }
  table.exam-table th:first-child, table.exam-table td:first-child { text-align:left; }
  table.exam-table tr.flag td { background:#F7EFE3; }
  .cell-ok { color: var(--ok); font-weight:700; }
  .cell-bad { color: var(--danger); font-weight:700; }
  .cell-none { color: var(--ink-soft); }
  .pair-row input[type=text] { margin-bottom: 0; }
</style>
</head>
<body>
<div class="bojagi-strip"></div>
<div class="wrap">
  <header class="top">
    <h1>Quiz <span>Room</span></h1>
    <div class="role-toggle">
      <button id="roleTeacherBtn" class="active">Host</button>
      <button id="roleStudentBtn">Student</button>
    </div>
  </header>

  <div id="teacherView"></div>
  <div id="studentView" style="display:none;"></div>
</div>

<script type="module">
// ---------- Firebase setup ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWWi_Zsl8wblOhIcA97bEVEmp75WyJIWo",
  authDomain: "quiz-b52e1.firebaseapp.com",
  projectId: "quiz-b52e1",
  storageBucket: "quiz-b52e1.firebasestorage.app",
  messagingSenderId: "692181807751",
  appId: "1:692181807751:web:956a8044cc14b32fe2be22"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// ---------- storage helpers (backed by Firestore) ----------
async function sGet(key) {
  try {
    const snap = await getDoc(doc(db, 'storage', key));
    return snap.exists() ? JSON.parse(snap.data().value) : null;
  } catch (e) { return null; }
}
async function sSet(key, val) {
  try {
    await setDoc(doc(db, 'storage', key), { value: JSON.stringify(val) });
    return true;
  } catch (e) { return false; }
}
function uid() { return Math.random().toString(36).slice(2, 9); }

// ---------- exam mode helpers ----------
// Estimates the difference between this device's clock and the server clock, so
// the host and all students count down to the same moment.
let serverOffset = null;
async function getServerOffset() {
  if (serverOffset !== null) return serverOffset;
  try {
    const ref = doc(db, 'storage', 'clock-sync');
    const t0 = Date.now();
    await setDoc(ref, { t: serverTimestamp() });
    const snap = await getDoc(ref);
    const t1 = Date.now();
    const t = snap.data() && snap.data().t;
    serverOffset = t ? t.toMillis() - Math.round((t0 + t1) / 2) : 0;
  } catch (e) { serverOffset = 0; }
  return serverOffset;
}
function nowMs() { return Date.now() + (serverOffset || 0); }
function nameKey(name) { return String(name).trim().toLowerCase().replace(/[\/\s]+/g, '_'); }
function subKey(code, name) { return 'exam-sub:' + code + ':' + nameKey(name); }
async function getRoster(code) {
  try {
    const snap = await getDoc(doc(db, 'storage', 'roster-' + code));
    return snap.exists() && snap.data().names ? snap.data().names : [];
  } catch (e) { return []; }
}
function fmtClock(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
// ---------- highlighter marks ----------
// A stroke is { pts: [x1,y1,x2,y2,...] } with x and y as whole numbers 0-10000
// (fractions of the image width and height), so the marks line up on any screen size.
const MARK_COLORS = ['rgba(255,214,0,0.6)', 'rgba(0,176,255,0.45)', 'rgba(255,64,129,0.4)', 'rgba(76,175,80,0.45)'];
function paintGroups(canvas, groups) {
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = canvas.width * 0.022;
  groups.forEach(g => {
    ctx.strokeStyle = g.color;
    (g.strokes || []).forEach(st => {
      const p = st.pts;
      if (!p || p.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(p[0] / 10000 * canvas.width, p[1] / 10000 * canvas.height);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] / 10000 * canvas.width, p[i + 1] / 10000 * canvas.height);
      if (p.length === 2) ctx.lineTo(p[0] / 10000 * canvas.width + 0.1, p[1] / 10000 * canvas.height);
      ctx.stroke();
    });
  });
}
function syncCanvas(img, canvas, redraw) {
  const fit = () => {
    const w = img.clientWidth, h = img.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    redraw();
  };
  if (img.complete) fit();
  img.addEventListener('load', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(img);
}
function examEndsAt(session) {
  return (session.minutes && session.startedAt) ? session.startedAt + session.minutes * 60000 : null;
}
function genCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

// ---------- sound effects (synthesized, no external audio files) ----------
function playCorrectSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [659.25, 987.77].forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      const start = ctx.currentTime + i*0.09;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.16, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start+0.24);
    });
  } catch(e) {}
}
function playWrongSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0, 0.28].forEach((delay, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sawtooth';
      const start = ctx.currentTime + delay;
      o.frequency.setValueAtTime(220 - i*20, start);
      o.frequency.exponentialRampToValueAtTime(90 - i*10, start + 0.26);
      g.gain.setValueAtTime(0.12, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.26);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start + 0.27);
    });
  } catch(e) {}
}
function playFanfare() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      const start = ctx.currentTime + i*0.14;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.18, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start+0.32);
    });
  } catch(e) {}
}
function launchConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.top = '0'; canvas.style.left = '0';
  canvas.style.width = '100%'; canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#7A2E3B', '#3F6E56', '#B8933A', '#21283B'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.4,
    r: 4 + Math.random() * 4,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12
  }));
  let frame = 0;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*2);
      ctx.restore();
    });
    frame++;
    if (frame < 160) requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
}

// Converts a GitHub "blob" file URL to its raw.githubusercontent.com equivalent.
// Leaves any other URL (or empty string) untouched.
function toRawGithubUrl(url) {
  if (!url) return url;
  const m = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
  if (m) {
    return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  }
  return url;
}

// ---------- state ----------
let role = 'teacher';
let hostAccess = false;
let teacherSubtab = 'manage'; // manage | monitor
let editingQuiz = null;
let activeSessionCode = null;
let monitorTimer = null;

let studentStep = 'join'; // join | play | done | exam
let examSession = null;
let examSub = null;
let examIdx = 0;
let examPollInt = null;
let examClockInt = null;
let examQuizCache = null;
let examHostClockInt = null;
let examLastSession = null;
let examMarksQ = 0;
let examMarksOff = new Set();
let studentSession = null;
let studentQuiz = null;
let studentName = '';
let studentJoinCode = '';
let studentSelected = null;
let studentFeedback = '';
let prefilledCode = '';

const params = new URLSearchParams(window.location.search);
hostAccess = params.has('host');
role = hostAccess ? 'teacher' : 'student';
prefilledCode = params.get('code') || '';
if (!hostAccess) {
  document.querySelector('.role-toggle').style.display = 'none';
}

const teacherViewEl = document.getElementById('teacherView');
const studentViewEl = document.getElementById('studentView');

document.getElementById('roleTeacherBtn').onclick = () => { role='teacher'; renderAll(); };
document.getElementById('roleStudentBtn').onclick = () => { role='student'; renderAll(); };

function renderAll() {
  document.getElementById('roleTeacherBtn').classList.toggle('active', role==='teacher');
  document.getElementById('roleStudentBtn').classList.toggle('active', role==='student');
  teacherViewEl.style.display = role==='teacher' ? 'block' : 'none';
  studentViewEl.style.display = role==='student' ? 'block' : 'none';
  if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; }
  if (examHostClockInt) { clearInterval(examHostClockInt); examHostClockInt = null; }
  if (role==='teacher') renderTeacher();
  else renderStudent();
}

// ================= TEACHER =================
function newEmptyQuiz() {
  return { id: uid(), title: '', questions: [ newEmptyQuestion() ] };
}
function newEmptyQuestion() {
  return { id: uid(), type: 'mc', text: '', imageUrl: '', options: ['', '', '', ''], correct: 0, correctIndices: [], pairs: [ newEmptyPair(), newEmptyPair() ] };
}
function newEmptyPair() {
  return { id: uid(), left: '', right: '' };
}

async function renderTeacher() {
  teacherViewEl.innerHTML = `
    <div class="subtabs">
      <button id="tabManage" class="${teacherSubtab==='manage'?'active':''}">Create / Manage Quizzes</button>
      <button id="tabMonitor" class="${teacherSubtab==='monitor'?'active':''}">Live Monitor</button>
    </div>
    <div id="teacherBody"></div>
  `;
  document.getElementById('tabManage').onclick = () => { teacherSubtab='manage'; editingQuiz=null; renderTeacher(); };
  document.getElementById('tabMonitor').onclick = () => { teacherSubtab='monitor'; renderTeacher(); };

  if (teacherSubtab === 'manage') await renderManage();
  else await renderMonitorSetup();
}

async function renderManage() {
  const body = document.getElementById('teacherBody');
  if (editingQuiz) {
    renderQuizEditor(body);
    return;
  }
  const index = (await sGet('quiz-index')) || [];
  body.innerHTML = `
    <div class="card jade">
      <div class="btn-row" style="margin-bottom: 4px;">
        <button class="btn jade" id="newQuizBtn">+ New Quiz</button>
        <button class="btn secondary" id="importQuizBtn">Import quiz (JSON)</button>
      </div>
      <div id="importWrap" style="display:none; margin-top: 12px;">
        <label>Paste the quiz JSON here</label>
        <textarea id="importText" rows="8" placeholder='{"title": "...", "exam": {"enabled": true, "minutes": 10}, "questions": [...]}'></textarea>
        <div class="err" id="importErr" style="display:none;"></div>
        <button class="btn jade" id="importSaveBtn">Save imported quiz</button>
      </div>
    </div>
    <div class="card">
      ${index.length === 0 ? '<div class="empty">No quizzes saved yet.</div>' :
        index.map(q => `
          <div class="quiz-row">
            <div>
              <div class="quiz-title">${escapeHtml(q.title)}</div>
              <div class="quiz-meta">${q.count} question${q.count===1?'':'s'} · ${q.exam ? 'Exam mode · ' : ''}${new Date(q.updatedAt).toLocaleDateString('en-CA')}</div>
            </div>
            <div class="btn-row">
              <button class="btn secondary" data-edit="${q.id}">Edit</button>
              <button class="btn jade" data-start="${q.id}">Start</button>
              <button class="btn secondary" data-del="${q.id}" style="border-color: var(--danger); color: var(--danger);">Delete</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
  document.getElementById('newQuizBtn').onclick = () => { editingQuiz = newEmptyQuiz(); renderTeacher(); };
  document.getElementById('importQuizBtn').onclick = () => {
    const w = document.getElementById('importWrap');
    w.style.display = w.style.display === 'none' ? 'block' : 'none';
  };
  document.getElementById('importSaveBtn').onclick = async () => {
    const errEl = document.getElementById('importErr');
    errEl.style.display = 'none';
    try {
      const data = JSON.parse(document.getElementById('importText').value);
      if (!data.title || !Array.isArray(data.questions) || !data.questions.length) throw new Error('Needs a title and at least one question.');
      const quiz = {
        id: uid(), title: data.title,
        exam: data.exam && data.exam.enabled ? { enabled: true, minutes: data.exam.minutes || null } : { enabled: false, minutes: null },
        questions: data.questions.map(x => {
          const base = newEmptyQuestion();
          return Object.assign(base, { text: x.text || '', imageUrl: x.imageUrl || '', options: x.options || base.options, correct: x.correct || 0, type: 'mc' });
        })
      };
      await persistQuiz(quiz);
      renderTeacher();
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Could not import: ' + e.message;
    }
  };
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = async () => {
      const quiz = await sGet('quiz:' + btn.dataset.edit);
      if (quiz) { editingQuiz = quiz; renderTeacher(); }
    };
  });
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this quiz?')) return;
      const idx = (await sGet('quiz-index')) || [];
      const next = idx.filter(q => q.id !== btn.dataset.del);
      await sSet('quiz-index', next);
      renderTeacher();
    };
  });
  body.querySelectorAll('[data-start]').forEach(btn => {
    btn.onclick = async () => {
      const quiz = await sGet('quiz:' + btn.dataset.start);
      if (!quiz || !quiz.questions.length) { alert('This quiz has no questions.'); return; }
      const code = genCode();
      if (quiz.exam && quiz.exam.enabled) {
        const examSess = {
          code, quizId: quiz.id, quizTitle: quiz.title, mode: 'exam',
          status: 'waiting', minutes: quiz.exam.minutes || null,
          total: quiz.questions.length, startedAt: null, endedAt: null
        };
        await sSet('session:' + code, examSess);
        activeSessionCode = code;
        teacherSubtab = 'monitor';
        renderTeacher();
        return;
      }
      const session = {
        code, quizId: quiz.id, quizTitle: quiz.title,
        studentName: '', status: 'waiting',
        currentIndex: 0, total: quiz.questions.length,
        answers: [], startedAt: Date.now()
      };
      await sSet('session:' + code, session);
      activeSessionCode = code;
      teacherSubtab = 'monitor';
      renderTeacher();
    };
  });
}

async function persistQuiz(q) {
  await sSet('quiz:' + q.id, q);
  const idx = (await sGet('quiz-index')) || [];
  const existing = idx.findIndex(x => x.id === q.id);
  const entry = { id: q.id, title: q.title, count: q.questions.length, exam: !!(q.exam && q.exam.enabled), updatedAt: Date.now() };
  if (existing >= 0) idx[existing] = entry; else idx.push(entry);
  await sSet('quiz-index', idx);
}

function renderQuizEditor(body) {
  const q = editingQuiz;
  body.innerHTML = `
    <div class="card">
      <label>Quiz Title</label>
      <input type="text" id="quizTitleInput" value="${escapeAttr(q.title)}" placeholder="e.g. Adjectives Practice, Lesson 3">
      <div class="q-block" style="margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:8px; color: var(--ink); font-weight:600; margin-bottom:6px;">
          <input type="checkbox" id="examChk" ${q.exam && q.exam.enabled ? 'checked' : ''}> Exam mode
        </label>
        <div class="hint" style="margin-top:0;">Students solve at their own pace on their own screen. No right or wrong is shown, and answers go to you when they submit.</div>
        <div id="examSettings" style="display:${q.exam && q.exam.enabled ? 'block' : 'none'};">
          <label>Time limit in minutes (leave blank for no timer; you can change it again before you press Start)</label>
          <input type="text" id="examMin" value="${q.exam && q.exam.minutes ? q.exam.minutes : ''}" placeholder="e.g. 10" style="max-width:160px; margin-bottom:0;">
        </div>
      </div>
      <div id="questionsWrap"></div>
      <div class="btn-row">
        <button class="btn secondary" id="addQBtn">+ Add Question</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn jade" id="saveQuizBtn">Save</button>
      <button class="btn secondary" id="cancelEditBtn">Cancel</button>
    </div>
  `;
  const qWrap = document.getElementById('questionsWrap');
  const isExam = () => !!(q.exam && q.exam.enabled);
  function renderQuestions() {
    qWrap.innerHTML = q.questions.map((qq, i) => `
      <div class="q-block" data-qi="${i}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <label style="margin-bottom:0;">Question ${i+1}</label>
            <button class="btn secondary move-up" data-qi="${i}" ${i===0?'disabled':''} style="padding:4px 8px; font-size:12px;" title="Move up">↑</button>
            <button class="btn secondary move-down" data-qi="${i}" ${i===q.questions.length-1?'disabled':''} style="padding:4px 8px; font-size:12px;" title="Move down">↓</button>
          </div>
          ${isExam() ? '<span class="hint" style="margin:0;">Multiple choice</span>' : `<select class="q-type" data-qi="${i}">
            <option value="mc" ${qq.type!=='match' && qq.type!=='dragdrop' ? 'selected':''}>Multiple Choice</option>
            <option value="match" ${qq.type==='match'?'selected':''}>Matching — draw a line</option>
            <option value="dragdrop" ${qq.type==='dragdrop'?'selected':''}>Matching — drag and drop</option>
          </select>`}
        </div>
        ${!isExam() && (qq.type === 'match' || qq.type === 'dragdrop') ? renderMatchFields(qq, i) : renderMcFields(qq, i)}
        <div class="btn-row">
          <button class="btn secondary del-q" data-qi="${i}" style="border-color: var(--danger); color: var(--danger);">Delete this question</button>
        </div>
      </div>
    `).join('');

    qWrap.querySelectorAll('.move-up').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.qi;
        if (i <= 0) return;
        [q.questions[i-1], q.questions[i]] = [q.questions[i], q.questions[i-1]];
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.move-down').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.qi;
        if (i >= q.questions.length - 1) return;
        [q.questions[i+1], q.questions[i]] = [q.questions[i], q.questions[i+1]];
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.q-type').forEach(el => {
      el.onchange = () => { q.questions[+el.dataset.qi].type = el.value; renderQuestions(); };
    });
    qWrap.querySelectorAll('.q-text').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].text = el.value; };
    });
    qWrap.querySelectorAll('.q-image').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].imageUrl = el.value; };
      el.onchange = () => {
        const converted = toRawGithubUrl(el.value.trim());
        q.questions[+el.dataset.qi].imageUrl = converted;
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.opt-text').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].options[+el.dataset.oi] = el.value; };
    });
    qWrap.querySelectorAll('.opt-correct').forEach(el => {
      el.onchange = () => { q.questions[+el.dataset.qi].correct = +el.dataset.oi; };
    });
    qWrap.querySelectorAll('.ms-text').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].options[+el.dataset.oi] = el.value; };
    });
    qWrap.querySelectorAll('.ms-correct').forEach(el => {
      el.onchange = () => {
        const qq = q.questions[+el.dataset.qi];
        const oi = +el.dataset.oi;
        if (el.checked) {
          if (!qq.correctIndices.includes(oi)) qq.correctIndices.push(oi);
        } else {
          qq.correctIndices = qq.correctIndices.filter(x => x !== oi);
        }
      };
    });
    qWrap.querySelectorAll('.add-card').forEach(el => {
      el.onclick = () => { q.questions[+el.dataset.qi].options.push(''); renderQuestions(); };
    });
    qWrap.querySelectorAll('.del-card').forEach(el => {
      el.onclick = () => {
        const qq = q.questions[+el.dataset.qi];
        const oi = +el.dataset.oi;
        if (qq.options.length <= 2) { alert('Need at least 2 cards.'); return; }
        qq.options.splice(oi, 1);
        qq.correctIndices = qq.correctIndices.filter(x => x !== oi).map(x => x > oi ? x - 1 : x);
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.pair-left').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].pairs[+el.dataset.pi].left = el.value; };
    });
    qWrap.querySelectorAll('.pair-right').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].pairs[+el.dataset.pi].right = el.value; };
    });
    qWrap.querySelectorAll('.add-pair').forEach(el => {
      el.onclick = () => { q.questions[+el.dataset.qi].pairs.push(newEmptyPair()); renderQuestions(); };
    });
    qWrap.querySelectorAll('.del-pair').forEach(el => {
      el.onclick = () => {
        const qq = q.questions[+el.dataset.qi];
        if (qq.pairs.length <= 2) { alert('A matching question needs at least 2 pairs.'); return; }
        qq.pairs.splice(+el.dataset.pi, 1);
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.del-q').forEach(el => {
      el.onclick = () => {
        if (q.questions.length <= 1) { alert('A quiz needs at least 1 question.'); return; }
        q.questions.splice(+el.dataset.qi, 1);
        renderQuestions();
      };
    });
  }
  function renderMcFields(qq, i) {
    return `
        <input type="text" class="q-text" data-qi="${i}" value="${escapeAttr(qq.text)}" placeholder="${isExam() ? 'Question label (e.g. 28번)' : 'Type the question'}">
        <label>${isExam() ? 'Passage image (the whole question). Paste the GitHub file link, or a path like images/102_28.png' : 'Image URL (optional — paste the GitHub file link, converts automatically)'}</label>
        <input type="text" class="q-image" data-qi="${i}" value="${escapeAttr(qq.imageUrl||'')}" placeholder="Paste the github.com/.../blob/... link here (leave blank if none)">
        ${qq.imageUrl ? `<img src="${escapeAttr(qq.imageUrl)}" style="max-width:100%; max-height:180px; display:block; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
        ${qq.options.map((opt, oi) => `
          <div class="opt-row">
            <input type="radio" name="correct-${i}" data-qi="${i}" data-oi="${oi}" class="opt-correct" ${qq.correct===oi?'checked':''}>
            <input type="text" class="opt-text" data-qi="${i}" data-oi="${oi}" value="${escapeAttr(opt)}" placeholder="Option ${oi+1}">
          </div>
        `).join('')}
        <div class="hint">Use the radio button to mark the correct answer</div>
    `;
  }
  function renderMultiselectFields(qq, i) {
    return `
        <input type="text" class="q-text" data-qi="${i}" value="${escapeAttr(qq.text)}" placeholder="Category or prompt (e.g. 겨울 - Winter)">
        <label>Image URL (optional — paste the GitHub file link, converts automatically)</label>
        <input type="text" class="q-image" data-qi="${i}" value="${escapeAttr(qq.imageUrl||'')}" placeholder="Paste the github.com/.../blob/... link here (leave blank if none)">
        ${qq.imageUrl ? `<img src="${escapeAttr(qq.imageUrl)}" style="max-width:100%; max-height:180px; display:block; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
        ${qq.options.map((opt, oi) => `
          <div class="opt-row">
            <input type="checkbox" class="ms-correct" data-qi="${i}" data-oi="${oi}" ${qq.correctIndices.includes(oi)?'checked':''}>
            <input type="text" class="ms-text" data-qi="${i}" data-oi="${oi}" value="${escapeAttr(opt)}" placeholder="Card ${oi+1}">
            <button class="btn secondary del-card" data-qi="${i}" data-oi="${oi}" style="padding:8px 12px; border-color: var(--danger); color: var(--danger);">✕</button>
          </div>
        `).join('')}
        <div class="btn-row" style="margin-bottom: 10px;">
          <button class="btn secondary add-card" data-qi="${i}">+ Add Card</button>
        </div>
        <div class="hint">Check every card that belongs with the prompt (one or more)</div>
    `;
  }
  function renderMatchFields(qq, i) {
    return `
        <input type="text" class="q-text" data-qi="${i}" value="${escapeAttr(qq.text)}" placeholder="Instructions (e.g. Match each word to its meaning)">
        <label>Image URL (optional — paste the GitHub file link, converts automatically)</label>
        <input type="text" class="q-image" data-qi="${i}" value="${escapeAttr(qq.imageUrl||'')}" placeholder="Paste the github.com/.../blob/... link here (leave blank if none)">
        ${qq.imageUrl ? `<img src="${escapeAttr(qq.imageUrl)}" style="max-width:100%; max-height:180px; display:block; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
        ${qq.pairs.map((p, pi) => `
          <div class="pair-row">
            <input type="text" class="pair-left" data-qi="${i}" data-pi="${pi}" value="${escapeAttr(p.left)}" placeholder="Left item">
            <input type="text" class="pair-right" data-qi="${i}" data-pi="${pi}" value="${escapeAttr(p.right)}" placeholder="Right item">
            <button class="btn secondary del-pair" data-qi="${i}" data-pi="${pi}" style="padding:8px 12px; border-color: var(--danger); color: var(--danger);">✕</button>
          </div>
        `).join('')}
        <div class="btn-row" style="margin-bottom: 10px;">
          <button class="btn secondary add-pair" data-qi="${i}">+ Add Pair</button>
        </div>
        <div class="hint">Students will connect each left item to its matching right item</div>
    `;
  }
  renderQuestions();

  document.getElementById('quizTitleInput').oninput = (e) => { q.title = e.target.value; };
  if (!q.exam) q.exam = { enabled: false, minutes: null };
  document.getElementById('examChk').onchange = (e) => {
    q.exam.enabled = e.target.checked;
    if (q.exam.enabled) q.questions.forEach(x => { x.type = 'mc'; });
    document.getElementById('examSettings').style.display = q.exam.enabled ? 'block' : 'none';
    renderQuestions();
  };
  document.getElementById('examMin').oninput = (e) => {
    const n = parseFloat(e.target.value);
    q.exam.minutes = n > 0 ? n : null;
  };
  document.getElementById('addQBtn').onclick = () => { q.questions.push(newEmptyQuestion()); renderQuestions(); };
  document.getElementById('cancelEditBtn').onclick = () => { editingQuiz = null; renderTeacher(); };
  document.getElementById('saveQuizBtn').onclick = async () => {
    if (!q.title.trim()) { alert('Please enter a quiz title.'); return; }
    for (const qq of q.questions) {
      if (qq.type === 'match' || qq.type === 'dragdrop') {
        if (qq.pairs.some(p => !p.left.trim() || !p.right.trim())) {
          alert('Please fill in every pair in each matching question.'); return;
        }
      } else if (qq.type === 'multiselect') {
        if (!qq.text.trim() || qq.options.some(o => !o.trim())) {
          alert('Please fill in every card and the category text.'); return;
        }
        if (qq.correctIndices.length === 0) {
          alert('Please check at least one correct card for each multi-select question.'); return;
        }
      } else {
        if (!qq.text.trim() || qq.options.some(o => !o.trim())) {
          alert('Please fill in every question and option.'); return;
        }
      }
    }
    await persistQuiz(q);
    editingQuiz = null;
    renderTeacher();
  };
}

async function renderMonitorSetup() {
  const body = document.getElementById('teacherBody');
  body.innerHTML = `
    <div class="card">
      <label>Load a session by code (starting a quiz brings you here automatically)</label>
      <input type="text" id="monitorCodeInput" value="${activeSessionCode||''}" placeholder="e.g. 4821">
      <button class="btn secondary" id="monitorLoadBtn">Load</button>
    </div>
    <div id="monitorBody"></div>
  `;
  document.getElementById('monitorLoadBtn').onclick = () => {
    activeSessionCode = document.getElementById('monitorCodeInput').value.trim();
    startMonitorPolling();
  };
  if (activeSessionCode) startMonitorPolling();
}

function startMonitorPolling() {
  if (monitorTimer) clearInterval(monitorTimer);
  renderMonitorBody();
  monitorTimer = setInterval(renderMonitorBody, 2000);
}

async function renderMonitorBody() {
  const el = document.getElementById('monitorBody');
  if (!el || !activeSessionCode) return;
  const session = await sGet('session:' + activeSessionCode);
  if (!session) { el.innerHTML = '<div class="card empty">Could not find a session with that code.</div>'; return; }
  if (session.mode === 'exam') { await renderExamMonitor(el, session); return; }
  const wrongCount = session.answers.filter(a => !a.isCorrect).length;
  const correctCount = session.answers.filter(a => a.isCorrect).length;
  el.innerHTML = `
    <div class="card plum">
      <div class="code-display">
        <div class="label">Give this code to the student</div>
        <div class="code">${activeSessionCode}</div>
      </div>
      <div style="margin-bottom: 14px;">
        <div style="font-size: 12px; color: var(--ink-soft); text-align:center; margin-bottom: 6px;">Or send this link (code is pre-filled):</div>
        <div style="display:flex; gap: 6px;">
          <input type="text" id="studentLinkInput" readonly value="${window.location.origin}${window.location.pathname}?code=${activeSessionCode}" style="flex:1; font-size:12px; margin-bottom:0; background: var(--white);" onclick="this.select()">
          <button class="btn secondary" id="copyLinkBtn" style="white-space:nowrap;">Copy</button>
        </div>
      </div>
      <div style="text-align:center; margin-bottom: 4px;">
        <span class="status-pill ${session.status==='active'?'live':''}">${
          session.status==='waiting' ? 'Waiting for student' :
          session.status==='active' ? (session.studentName + ' · in progress') :
          session.status==='closed' ? 'Closed' :
          (session.studentName + ' · done')
        }</span>
      </div>
      <div style="text-align:center; font-size: 13px; color: var(--ink-soft); margin-top: 8px;">
        ${session.quizTitle} · ${correctCount + wrongCount} / ${session.total} answered · Correct ${correctCount} / Wrong ${wrongCount}
      </div>
      ${session.status !== 'closed' ? `
      <div style="text-align:center; margin-top: 14px;">
        <button class="btn secondary" id="endSessionBtn" style="border-color: var(--danger); color: var(--danger);">End Session</button>
      </div>` : ''}
      ${session.status === 'done' || session.status === 'closed' ? `
      <div style="text-align:center; margin-top: 10px;">
        <button class="btn jade" id="restartSessionBtn">Restart — let the student try again</button>
      </div>` : ''}
    </div>
    <div class="card ${wrongCount>0?'plum':''}">
      <div style="font-weight:700; margin-bottom: 8px;">Results by question</div>
      ${session.answers.length === 0 ? '<div class="empty">No answers yet.</div>' :
        session.answers.map((a, i) => `
          <div class="answer-log-row">
            <div class="mark ${a.isCorrect?'correct':'wrong'}">${a.isCorrect?'○':'✕'}</div>
            <div class="log-text">
              <div class="qtext">${i+1}. ${escapeHtml(a.qText)}</div>
              ${a.imageUrl ? `<img src="${escapeAttr(a.imageUrl)}" style="max-width:160px; max-height:100px; display:block; margin:4px 0; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
              <div class="picked">Selected: ${escapeHtml(a.selectedText)}</div>
              ${!a.isCorrect ? `<div class="correct-answer">Correct answer: ${escapeHtml(a.correctText)}</div>` : ''}
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
  const endBtn = document.getElementById('endSessionBtn');
  if (endBtn) {
    endBtn.onclick = async () => {
      if (!confirm('End this session? The student link will stop working.')) return;
      session.status = 'closed';
      await sSet('session:' + activeSessionCode, session);
      renderMonitorBody();
    };
  }
  const restartBtn = document.getElementById('restartSessionBtn');
  if (restartBtn) {
    restartBtn.onclick = async () => {
      session.status = 'waiting';
      session.currentIndex = 0;
      session.answers = [];
      await sSet('session:' + activeSessionCode, session);
      renderMonitorBody();
    };
  }
  const copyBtn = document.getElementById('copyLinkBtn');
  if (copyBtn) {
    copyBtn.onclick = async () => {
      const input = document.getElementById('studentLinkInput');
      try {
        await navigator.clipboard.writeText(input.value);
      } catch (e) {
        input.select();
        document.execCommand('copy');
      }
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    };
  }
}

// ---------- exam mode: host side ----------
const CIRC = ['①','②','③','④','⑤','⑥'];
async function renderExamMonitor(el, session) {
  await getServerOffset();
  examLastSession = session;
  if (!examQuizCache || examQuizCache.id !== session.quizId) examQuizCache = await sGet('quiz:' + session.quizId);
  const quiz = examQuizCache;
  if (!quiz) { el.innerHTML = '<div class="card empty">Could not load the quiz for this session.</div>'; return; }

  // auto-end when the time is up (the host page does this while it is open)
  const endsAt = examEndsAt(session);
  if (session.status === 'running' && endsAt && nowMs() > endsAt + 3000) {
    session.status = 'ended'; session.endedAt = nowMs();
    await sSet('session:' + activeSessionCode, session);
  }

  const names = await getRoster(activeSessionCode);
  const subs = await Promise.all(names.map(n => sGet(subKey(activeSessionCode, n))));
  const students = names.map((n, i) => ({ name: n, sub: subs[i] || { answers: {}, submitted: false } }));
  const total = quiz.questions.length;
  const allSubmitted = students.length > 0 && students.every(st => st.sub.submitted);
  const showResults = session.status === 'ended' || allSubmitted;

  // controls: rebuilt only when the session status changes, so the minutes box keeps focus
  if (el.dataset.exBuilt !== activeSessionCode) {
    el.innerHTML = '<div id="exCtl"></div><div id="exLive"></div><div id="exMarks"></div>';
    el.dataset.exBuilt = activeSessionCode;
    el.dataset.exStatus = '';
  }
  const ctl = document.getElementById('exCtl');
  if (el.dataset.exStatus !== session.status) {
    el.dataset.exStatus = session.status;
    const link = `${window.location.origin}${window.location.pathname}?code=${activeSessionCode}`;
    ctl.innerHTML = `
      <div class="card plum">
        <div class="code-display">
          <div class="label">Give this code to the students</div>
          <div class="code">${activeSessionCode}</div>
        </div>
        <div style="margin-bottom: 14px;">
          <div style="font-size: 12px; color: var(--ink-soft); text-align:center; margin-bottom: 6px;">Or send this link (code is pre-filled):</div>
          <div style="display:flex; gap: 6px;">
            <input type="text" id="studentLinkInput" readonly value="${link}" style="flex:1; font-size:12px; margin-bottom:0; background: var(--white);" onclick="this.select()">
            <button class="btn secondary" id="copyLinkBtn" style="white-space:nowrap;">Copy</button>
          </div>
        </div>
        <div style="text-align:center; margin-bottom: 6px;">
          <span class="status-pill ${session.status==='running'?'live':''}">${session.quizTitle} · Exam · ${
            session.status==='waiting' ? 'Waiting to start' : session.status==='running' ? 'In progress' : 'Ended'}</span>
        </div>
        ${session.status === 'waiting' ? `
          <div style="text-align:center; margin-top:12px;">
            <label style="display:inline-block; margin-right:8px;">Time limit (minutes, blank = no timer)</label>
            <input type="text" id="exMin" value="${session.minutes || ''}" style="width:90px; margin-bottom:0;">
          </div>
          <div style="text-align:center; margin-top:12px;">
            <button class="btn jade" id="exStartBtn">Start</button>
          </div>` : ''}
        ${session.status === 'running' ? `
          <div style="text-align:center; margin-top:12px;">
            <div class="exam-clock" id="exClock"></div>
            <button class="btn secondary" id="exEndBtn" style="margin-top:10px; border-color: var(--danger); color: var(--danger);">End now</button>
          </div>` : ''}
      </div>`;
    const copyBtn = document.getElementById('copyLinkBtn');
    copyBtn.onclick = async () => {
      const input = document.getElementById('studentLinkInput');
      try { await navigator.clipboard.writeText(input.value); } catch (e) { input.select(); document.execCommand('copy'); }
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    };
    const startBtn = document.getElementById('exStartBtn');
    if (startBtn) startBtn.onclick = async () => {
      const raw = document.getElementById('exMin').value.trim();
      const m = raw === '' ? null : parseFloat(raw);
      if (raw !== '' && !(m > 0)) { alert('Please enter the minutes as a number, or leave it blank.'); return; }
      const fresh = await sGet('session:' + activeSessionCode);
      fresh.minutes = m; fresh.status = 'running'; fresh.startedAt = nowMs();
      await sSet('session:' + activeSessionCode, fresh);
      renderMonitorBody();
    };
    const endBtn = document.getElementById('exEndBtn');
    if (endBtn) endBtn.onclick = async () => {
      if (!confirm('End the exam now? Anyone still solving will be submitted automatically.')) return;
      const fresh = await sGet('session:' + activeSessionCode);
      fresh.status = 'ended'; fresh.endedAt = nowMs();
      await sSet('session:' + activeSessionCode, fresh);
      renderMonitorBody();
    };
    if (examHostClockInt) clearInterval(examHostClockInt);
    examHostClockInt = setInterval(() => {
      const c = document.getElementById('exClock');
      const sess = examLastSession;
      if (!c || !sess) return;
      const e = examEndsAt(sess);
      c.textContent = e ? fmtClock(e - nowMs()) : 'No time limit';
    }, 500);
  }

  // live part: who joined, progress, and results
  const live = document.getElementById('exLive');
  const rosterHtml = students.length === 0
    ? '<div class="empty">No students have joined yet.</div>'
    : students.map(st => {
        const n = Object.keys(st.sub.answers || {}).length;
        const state = st.sub.submitted ? 'Submitted' : (session.status === 'waiting' ? 'Joined' : `Solving · ${n} / ${total} answered`);
        return `<div class="answer-log-row"><div class="log-text"><div class="qtext">${escapeHtml(st.name)}</div><div class="picked">${state}</div></div></div>`;
      }).join('');

  let resultsHtml = '';
  if (showResults && students.length) {
    const scores = students.map(() => 0);
    const rows = quiz.questions.map((q, qi) => {
      const picks = students.map(st => st.sub.answers ? st.sub.answers[q.id] : undefined);
      picks.forEach((p, k) => { if (p === q.correct) scores[k]++; });
      const differ = new Set(picks.map(p => p === undefined ? 'x' : p)).size > 1;
      const anyWrong = picks.some(p => p !== q.correct);
      const cells = picks.map(p => p === undefined
        ? '<span class="cell-none">–</span>'
        : `<span class="${p === q.correct ? 'cell-ok' : 'cell-bad'}">${CIRC[p] || (p+1)} ${p === q.correct ? '○' : '✕'}</span>`).join('</td><td>');
      return `<tr class="${differ || anyWrong ? 'flag' : ''}"><td>${escapeHtml(q.text)}</td><td>${CIRC[q.correct] || (q.correct+1)}</td><td>${cells}</td></tr>`;
    }).join('');
    resultsHtml = `
      <div class="card gold">
        <div style="font-weight:700; margin-bottom: 8px;">Results</div>
        <table class="exam-table">
          <tr><th>Question</th><th>Answer</th>${students.map(st => `<th>${escapeHtml(st.name)}</th>`).join('')}</tr>
          ${rows}
          <tr><th>Score</th><th></th>${scores.map(sc => `<th>${sc} / ${total}</th>`).join('')}</tr>
        </table>
        <div class="hint" style="margin-top:10px;">Shaded rows: someone got it wrong or the answers differ. Start there.</div>
      </div>`;
  } else if (session.status !== 'waiting') {
    resultsHtml = '<div class="card"><div class="empty">Results appear when everyone has submitted or time is up. Please do not share this screen while students are solving.</div></div>';
  }

  live.innerHTML = `
    <div class="card"><div style="font-weight:700; margin-bottom: 8px;">Students</div>${rosterHtml}</div>
    ${resultsHtml}`;

  // marks card: rebuilt only when the marks or the selection change, so the image does not flicker
  const marksEl = document.getElementById('exMarks');
  if (showResults && students.length) {
    const sig = JSON.stringify([students.map(st => [st.name, st.sub.marks || null]), examMarksQ, [...examMarksOff]]);
    if (marksEl.dataset.sig !== sig) {
      marksEl.dataset.sig = sig;
      drawMarksCard(marksEl, quiz, students);
    }
  } else {
    marksEl.innerHTML = '';
    marksEl.dataset.sig = '';
  }
}

function drawMarksCard(el, quiz, students) {
  if (examMarksQ >= quiz.questions.length) examMarksQ = 0;
  const q = quiz.questions[examMarksQ];
  const count = (st) => ((st.sub.marks && st.sub.marks[q.id]) || []).length;
  el.innerHTML = `
    <div class="card plum">
      <div style="font-weight:700; margin-bottom: 8px;">Marks</div>
      <div class="exam-nav">${quiz.questions.map((x, i) => `<button data-mq="${i}" class="${i === examMarksQ ? 'current' : ''}">${escapeHtml(x.text)}</button>`).join('')}</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px;">
        ${students.map((st, k) => `
          <label style="display:flex; align-items:center; gap:6px; margin:0; color: var(--ink);">
            <input type="checkbox" data-ms="${escapeAttr(st.name)}" ${examMarksOff.has(st.name) ? '' : 'checked'}>
            <span style="display:inline-block; width:14px; height:14px; background:${MARK_COLORS[k % MARK_COLORS.length]}; border:1px solid var(--line);"></span>
            ${escapeHtml(st.name)} (${count(st)})
          </label>`).join('')}
      </div>
      ${q.imageUrl ? `<div class="mark-wrap"><img id="exMarkImg" src="${escapeAttr(q.imageUrl)}" onerror="this.style.display='none'"><canvas id="exMarkCanvas" class="mark-canvas" style="pointer-events:none;"></canvas></div>` : '<div class="empty">This question has no image.</div>'}
    </div>`;
  el.querySelectorAll('[data-mq]').forEach(b => { b.onclick = () => { examMarksQ = +b.dataset.mq; renderMonitorBody(); }; });
  el.querySelectorAll('[data-ms]').forEach(b => {
    b.onchange = () => {
      if (b.checked) examMarksOff.delete(b.dataset.ms); else examMarksOff.add(b.dataset.ms);
      renderMonitorBody();
    };
  });
  const img = document.getElementById('exMarkImg');
  const cv = document.getElementById('exMarkCanvas');
  if (img && cv) {
    const redraw = () => paintGroups(cv, students
      .map((st, k) => ({ name: st.name, strokes: (st.sub.marks && st.sub.marks[q.id]) || [], color: MARK_COLORS[k % MARK_COLORS.length] }))
      .filter(g => !examMarksOff.has(g.name)));
    syncCanvas(img, cv, redraw);
  }
}

// ---------- exam mode: student side ----------
function clearExamTimers() {
  if (examPollInt) { clearInterval(examPollInt); examPollInt = null; }
  if (examClockInt) { clearInterval(examClockInt); examClockInt = null; }
}

async function startExamStudent(name, code, session, quiz, errEl) {
  await getServerOffset();
  let sub = await sGet(subKey(code, name));
  if (!sub) {
    if (session.status === 'ended') { errEl.style.display='block'; errEl.textContent='This exam has already ended.'; return; }
    sub = { name, answers: {}, submitted: false, submittedAt: null };
    await sSet(subKey(code, name), sub);
  }
  try { await setDoc(doc(db, 'storage', 'roster-' + code), { names: arrayUnion(name) }, { merge: true }); } catch (e) {}
  studentName = name;
  studentJoinCode = code;
  studentQuiz = quiz;
  examSession = session;
  examSub = sub;
  examIdx = 0;
  studentStep = 'exam';
  renderStudent();
}

function renderExam() {
  clearExamTimers();
  examPollInt = setInterval(pollExam, 1500);
  drawExam();
}

async function pollExam() {
  const s = await sGet('session:' + studentJoinCode);
  if (!s) return;
  const prev = examSession.status;
  examSession = s;
  if (s.status === 'ended' && !examSub.submitted) { await submitExam(); return; }
  if (s.status !== prev) drawExam();
}

async function submitExam() {
  if (examSub.submitted) return;
  examSub.submitted = true;
  examSub.submittedAt = nowMs();
  await sSet(subKey(studentJoinCode, studentName), examSub);
  clearExamTimers();
  drawExam();
}

function drawExam() {
  const total = studentQuiz.questions.length;
  if (examSub.submitted) {
    studentViewEl.innerHTML = `
      <div class="card jade">
        <div class="score-big">
          <div>Submitted. Thank you, ${escapeHtml(studentName)}.</div>
          <div style="font-size:15px; color: var(--ink-soft); margin-top:8px;">Please wait for your teacher.</div>
        </div>
      </div>`;
    return;
  }
  if (examSession.status === 'waiting') {
    studentViewEl.innerHTML = `
      <div class="card">
        <div class="score-big">
          <div>Hi, ${escapeHtml(studentName)}.</div>
          <div style="font-size:15px; color: var(--ink-soft); margin-top:8px;">Please wait. Your teacher will press Start.</div>
        </div>
      </div>`;
    return;
  }
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="exam-bar">
        <div class="student-q-num" style="margin:0;">${escapeHtml(studentName)}</div>
        <div class="exam-clock" id="examClock"></div>
      </div>
      <div class="exam-nav" id="examNav"></div>
      <div id="examQ"></div>
    </div>`;
  drawExamQuestion();
  if (examClockInt) clearInterval(examClockInt);
  const tick = () => {
    const el = document.getElementById('examClock');
    const e = examEndsAt(examSession);
    if (!el) return;
    if (!e) { el.textContent = ''; return; }
    const left = e - nowMs();
    el.textContent = fmtClock(left);
    if (left <= 0) submitExam();
  };
  tick();
  examClockInt = setInterval(tick, 500);
}

function drawExamQuestion() {
  const qs = studentQuiz.questions;
  const q = qs[examIdx];
  const nav = document.getElementById('examNav');
  nav.innerHTML = qs.map((x, i) => `<button data-i="${i}" class="${examSub.answers[x.id] !== undefined ? 'answered' : ''} ${i === examIdx ? 'current' : ''}">${escapeHtml(x.text)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => { b.onclick = () => { examIdx = +b.dataset.i; drawExamQuestion(); }; });
  const picked = examSub.answers[q.id];
  document.getElementById('examQ').innerHTML = `
    ${q.imageUrl ? `<div class="mark-wrap"><img id="examImg" src="${escapeAttr(q.imageUrl)}" onerror="this.style.display='none'"><canvas id="markCanvas" class="mark-canvas"></canvas></div>
    <div class="mark-tools">
      <div class="hint">Optional: drag on the passage to highlight parts that are hard for you.</div>
      <button class="btn secondary" id="markUndo">Undo</button>
      <button class="btn secondary" id="markClear">Clear</button>
    </div>` : ''}
    <div id="examOpts">${q.options.map((opt, oi) => `
      <button class="opt-btn ${picked === oi ? 'exam-sel' : ''}" data-oi="${oi}">${CIRC[oi] || (oi+1)} ${escapeHtml(opt)}</button>`).join('')}</div>
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn secondary" id="examPrev" ${examIdx === 0 ? 'disabled' : ''}>Back</button>
      <button class="btn secondary" id="examNext" ${examIdx === qs.length - 1 ? 'disabled' : ''}>Next</button>
      ${examIdx === qs.length - 1 ? '<button class="btn jade" id="examSubmit" style="margin-left:auto;">Submit all answers</button>' : ''}
    </div>
    <div class="hint" style="margin-top:12px;">${examIdx === qs.length - 1
      ? 'This sends the answers for every question. You cannot change them after this.'
      : 'Your answer is saved when you tap it. Press Submit all answers on the last question when you are done.'}</div>`;
  const mImg = document.getElementById('examImg');
  const mCv = document.getElementById('markCanvas');
  if (mImg && mCv) {
    examSub.marks = examSub.marks || {};
    const strokes = () => (examSub.marks[q.id] = examSub.marks[q.id] || []);
    const redraw = () => paintGroups(mCv, [{ strokes: strokes(), color: MARK_COLORS[0] }]);
    const saveSub = () => sSet(subKey(studentJoinCode, studentName), examSub);
    const toPt = (e) => {
      const r = mCv.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) / r.width * 10000), Math.round((e.clientY - r.top) / r.height * 10000)];
    };
    syncCanvas(mImg, mCv, redraw);
    let cur = null;
    mCv.onpointerdown = (e) => {
      e.preventDefault();
      try { mCv.setPointerCapture(e.pointerId); } catch (err) {}
      cur = { pts: toPt(e) };
      strokes().push(cur);
      redraw();
    };
    mCv.onpointermove = (e) => {
      if (!cur) return;
      const pt = toPt(e);
      const n = cur.pts.length;
      if (Math.abs(pt[0] - cur.pts[n - 2]) + Math.abs(pt[1] - cur.pts[n - 1]) < 30) return;
      if (n >= 800) return;
      cur.pts.push(pt[0], pt[1]);
      redraw();
    };
    const endStroke = () => { if (!cur) return; cur = null; saveSub(); };
    mCv.onpointerup = endStroke;
    mCv.onpointercancel = endStroke;
    document.getElementById('markUndo').onclick = () => { strokes().pop(); redraw(); saveSub(); };
    document.getElementById('markClear').onclick = () => { examSub.marks[q.id] = []; redraw(); saveSub(); };
  }
  document.querySelectorAll('#examOpts .opt-btn').forEach(b => {
    b.onclick = () => {
      examSub.answers[q.id] = +b.dataset.oi;
      sSet(subKey(studentJoinCode, studentName), examSub);
      drawExamQuestion();
    };
  });
  document.getElementById('examPrev').onclick = () => { examIdx--; drawExamQuestion(); };
  document.getElementById('examNext').onclick = () => { examIdx++; drawExamQuestion(); };
  const submitBtn = document.getElementById('examSubmit');
  if (submitBtn) submitBtn.onclick = async () => {
    const left = qs.filter(x => examSub.answers[x.id] === undefined).length;
    const msg = left ? `You have ${left} unanswered. Submit all answers now?` : 'Submit all answers?';
    if (confirm(msg)) await submitExam();
  };
}

// ================= STUDENT =================
function renderStudent() {
  if (studentStep === 'join') renderStudentJoin();
  else if (studentStep === 'exam') renderExam();
  else if (studentStep === 'play') renderStudentPlay();
  else renderStudentDone();
}

function renderStudentJoin() {
  const hasPrefilled = !!(prefilledCode && !studentJoinCode);
  studentViewEl.innerHTML = `
    <div class="card jade join-form">
      <label>Name</label>
      <input type="text" id="stuName" value="${escapeAttr(studentName)}" placeholder="Enter your name">
      ${hasPrefilled ? '' : `
      <label>Session Code</label>
      <input type="text" id="stuCode" value="${escapeAttr(studentJoinCode)}" placeholder="Code your teacher gave you">
      `}
      <div class="err" id="stuErr" style="display:none;"></div>
      <button class="btn jade" id="stuJoinBtn" style="width:100%;">Start</button>
    </div>
  `;
  document.getElementById('stuJoinBtn').onclick = async () => {
    const name = document.getElementById('stuName').value.trim();
    const codeInput = document.getElementById('stuCode');
    const code = hasPrefilled ? prefilledCode : (codeInput ? codeInput.value.trim() : '');
    const errEl = document.getElementById('stuErr');
    if (!name || !code) { errEl.style.display='block'; errEl.textContent='Please enter your name.'; return; }
    const session = await sGet('session:' + code);
    if (!session) { errEl.style.display='block'; errEl.textContent='Could not find that code. Please check it.'; return; }
    if (session.status === 'closed') { errEl.style.display='block'; errEl.textContent='This session has ended. Ask your teacher to start a new one.'; return; }
    if (session.status === 'done') { errEl.style.display='block'; errEl.textContent='This session has already been completed. Ask your teacher to start a new one.'; return; }
    const quiz = await sGet('quiz:' + session.quizId);
    if (!quiz) { errEl.style.display='block'; errEl.textContent='Could not load the quiz.'; return; }
    if (session.mode === 'exam') { await startExamStudent(name, code, session, quiz, errEl); return; }
    session.studentName = name;
    session.status = 'active';
    await sSet('session:' + code, session);
    studentName = name;
    studentJoinCode = code;
    studentSession = session;
    studentQuiz = quiz;
    studentSelected = null;
    studentFeedback = '';
    studentStep = 'play';
    renderStudent();
  };
}

function renderStudentPlay() {
  const q = studentQuiz.questions[studentSession.currentIndex];
  if (q.type === 'match') { renderStudentPlayMatch(q); return; }
  if (q.type === 'multiselect') { renderStudentPlayMultiselect(q); return; }
  if (q.type === 'dragdrop') { renderStudentPlayDragDrop(q); return; }
  renderStudentPlayMC(q);
}

function advanceToNext() {
  studentSession.currentIndex += 1;
  studentSelected = null;
  studentFeedback = '';
  if (studentSession.currentIndex >= studentQuiz.questions.length) {
    studentSession.status = 'done';
  }
  sSet('session:' + studentJoinCode, studentSession).then(() => {
    studentStep = studentSession.status === 'done' ? 'done' : 'play';
    renderStudent();
  });
}

function renderStudentPlayMC(q) {
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text)}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:280px; display:block; margin-bottom:18px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <div id="optsWrap"></div>
      <div class="feedback-line ${studentFeedback && studentSelected===q.correct?'ok':studentFeedback?'bad':''}">${studentFeedback}</div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  optsWrap.innerHTML = q.options.map((opt, oi) => `
    <button class="opt-btn" data-oi="${oi}">${escapeHtml(opt)}</button>
  `).join('');
  optsWrap.querySelectorAll('.opt-btn').forEach(btn => {
    btn.onclick = async () => {
      if (studentSelected !== null) return;
      const oi = +btn.dataset.oi;
      studentSelected = oi;
      const isCorrect = oi === q.correct;
      studentFeedback = isCorrect ? '✅ Correct!' : "❌ Not quite — you'll get it next time!";
      if (isCorrect) playCorrectSound(); else playWrongSound();
      optsWrap.querySelectorAll('.opt-btn').forEach((b2, i2) => {
        b2.disabled = true;
        if (i2 === oi) b2.classList.add('selected', isCorrect ? 'ok' : 'bad');
        if (i2 === q.correct && !isCorrect) b2.classList.add('reveal-correct');
      });
      const fb = document.querySelector('.feedback-line');
      fb.textContent = studentFeedback;
      fb.classList.add(isCorrect ? 'ok' : 'bad', 'pop');
      studentSession.answers.push({
        qText: q.text,
        imageUrl: q.imageUrl || '',
        selectedText: q.options[oi],
        correctText: q.options[q.correct],
        isCorrect
      });
      await sSet('session:' + studentJoinCode, studentSession);
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').onclick = () => advanceToNext();
    };
  });
}

function renderStudentPlayMultiselect(q) {
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text)}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:280px; display:block; margin-bottom:18px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <div id="msWrap" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;"></div>
      <button class="btn jade" id="msSubmitBtn">Submit</button>
      <div class="feedback-line"></div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const msWrap = document.getElementById('msWrap');
  msWrap.innerHTML = q.options.map((opt, oi) => `
    <button class="opt-btn" data-oi="${oi}" style="width:auto; flex:1 1 45%; text-align:center; margin-bottom:0;">${escapeHtml(opt)}</button>
  `).join('');
  const selected = new Set();
  msWrap.querySelectorAll('.opt-btn').forEach(btn => {
    btn.onclick = () => {
      const oi = +btn.dataset.oi;
      if (selected.has(oi)) { selected.delete(oi); btn.classList.remove('selected', 'ok'); }
      else { selected.add(oi); btn.classList.add('selected', 'ok'); }
    };
  });
  document.getElementById('msSubmitBtn').onclick = async () => {
    if (selected.size === 0) return;
    const chosen = Array.from(selected).sort((a,b)=>a-b);
    const correctSorted = q.correctIndices.slice().sort((a,b)=>a-b);
    const isCorrect = chosen.length === correctSorted.length && chosen.every((v,i) => v === correctSorted[i]);
    const feedbackEl = document.querySelector('.feedback-line');
    feedbackEl.textContent = isCorrect ? 'Correct!' : "Not quite — you'll get it next time!";
    feedbackEl.classList.add(isCorrect ? 'ok' : 'bad');
    if (!isCorrect) playWrongSound();
    msWrap.querySelectorAll('.opt-btn').forEach((b2, i2) => {
      b2.disabled = true;
      const shouldBeCorrect = q.correctIndices.includes(i2);
      const wasChosen = selected.has(i2);
      b2.classList.remove('ok');
      if (wasChosen && shouldBeCorrect) b2.classList.add('ok');
      else if (wasChosen && !shouldBeCorrect) b2.classList.add('bad');
      else if (!wasChosen && shouldBeCorrect) b2.classList.add('reveal-correct');
    });
    document.getElementById('msSubmitBtn').disabled = true;
    studentSession.answers.push({
      qText: q.text,
      imageUrl: q.imageUrl || '',
      selectedText: chosen.map(i => q.options[i]).join(', ') || '(none)',
      correctText: correctSorted.map(i => q.options[i]).join(', '),
      isCorrect
    });
    await sSet('session:' + studentJoinCode, studentSession);
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').onclick = () => advanceToNext();
  };
}

function renderStudentPlayMatch(q) {
  const leftItems = q.pairs.map((p, i) => ({ id: p.id, text: p.left, num: i+1 }));
  const rightItems = shuffleArray(q.pairs.map(p => ({ id: p.id, text: p.right })));
  const letters = 'ABCDEFGHIJKLMNOP';
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text || 'Match each item on the left to its pair on the right')}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:260px; display:block; margin-bottom:16px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <div class="hint" style="margin-top:-4px;">Tap one item on the left, then tap its match on the right (either side first works)</div>
      <div class="match-wrap" id="matchWrap">
        <svg class="match-svg" id="matchSvg"></svg>
        <div class="match-col">
          ${leftItems.map(li => `
            <button class="match-pill" data-side="left" data-id="${li.id}">
              <span class="match-badge left-badge">${li.num}</span>
              <span class="match-text">${escapeHtml(li.text)}</span>
              <span class="match-dot" data-dot="left-${li.id}"></span>
            </button>
          `).join('')}
        </div>
        <div class="match-col">
          ${rightItems.map((ri, idx) => `
            <button class="match-pill" data-side="right" data-id="${ri.id}">
              <span class="match-dot" data-dot="right-${ri.id}"></span>
              <span class="match-badge right-badge">${letters[idx]}</span>
              <span class="match-text">${escapeHtml(ri.text)}</span>
            </button>
          `).join('')}
        </div>
      </div>
      <div class="feedback-line"></div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const wrap = document.getElementById('matchWrap');
  const svg = document.getElementById('matchSvg');
  let selLeftId = null;
  let selRightId = null;
  let resolving = false;
  let mistakeCount = 0;
  const matched = {}; // leftId -> rightId, only permanent CORRECT matches

  function drawLine(leftId, rightId, correct) {
    const wrapRect = wrap.getBoundingClientRect();
    const dotL = wrap.querySelector(`[data-dot="left-${leftId}"]`).getBoundingClientRect();
    const dotR = wrap.querySelector(`[data-dot="right-${rightId}"]`).getBoundingClientRect();
    const x1 = dotL.left + dotL.width/2 - wrapRect.left;
    const y1 = dotL.top + dotL.height/2 - wrapRect.top;
    const x2 = dotR.left + dotR.width/2 - wrapRect.left;
    const y2 = dotR.top + dotR.height/2 - wrapRect.top;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', correct ? '#3F6E56' : '#B0413E');
    line.setAttribute('stroke-width', '2.5');
    svg.appendChild(line);
    return line;
  }

  function checkDone() {
    if (Object.keys(matched).length !== q.pairs.length) return;
    const fb = document.querySelector('.feedback-line');
    fb.textContent = mistakeCount === 0
      ? 'All matched correctly!'
      : `All matched — ${mistakeCount} mistake${mistakeCount===1?'':'s'} along the way`;
    fb.classList.add(mistakeCount === 0 ? 'ok' : 'bad');
    studentSession.answers.push({
      qText: q.text || 'Matching question',
      imageUrl: '',
      selectedText: mistakeCount === 0 ? 'Matched all pairs correctly' : `Matched all pairs, ${mistakeCount} mistake${mistakeCount===1?'':'s'}`,
      correctText: '',
      isCorrect: mistakeCount === 0
    });
    sSet('session:' + studentJoinCode, studentSession);
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').onclick = () => advanceToNext();
  }

  function tryCommitMatch() {
    if (resolving) return;
    if (selLeftId === null || selRightId === null) return;
    const lid = selLeftId, rid = selRightId;
    const leftBtn = wrap.querySelector(`.match-pill[data-side="left"][data-id="${lid}"]`);
    const rightBtn = wrap.querySelector(`.match-pill[data-side="right"][data-id="${rid}"]`);
    const correct = lid === rid;
    selLeftId = null;
    selRightId = null;
    if (correct) {
      matched[lid] = rid;
      leftBtn.classList.remove('selected');
      rightBtn.classList.remove('selected');
      leftBtn.classList.add('matched-ok');
      rightBtn.classList.add('matched-ok');
      drawLine(lid, rid, true);
      checkDone();
    } else {
      mistakeCount++;
      playWrongSound();
      leftBtn.classList.add('matched-bad');
      rightBtn.classList.add('matched-bad');
      const tempLine = drawLine(lid, rid, false);
      resolving = true;
      setTimeout(() => {
        leftBtn.classList.remove('matched-bad', 'selected');
        rightBtn.classList.remove('matched-bad', 'selected');
        tempLine.remove();
        resolving = false;
      }, 700);
    }
  }

  wrap.querySelectorAll('.match-pill[data-side="left"]').forEach(btn => {
    btn.onclick = () => {
      if (resolving) return;
      if (matched[btn.dataset.id]) return;
      wrap.querySelectorAll('.match-pill[data-side="left"]').forEach(b => b.classList.remove('selected'));
      selLeftId = btn.dataset.id;
      btn.classList.add('selected');
      tryCommitMatch();
    };
  });
  wrap.querySelectorAll('.match-pill[data-side="right"]').forEach(btn => {
    btn.onclick = () => {
      if (resolving) return;
      const rid = btn.dataset.id;
      if (Object.values(matched).includes(rid)) return;
      wrap.querySelectorAll('.match-pill[data-side="right"]').forEach(b => b.classList.remove('selected'));
      selRightId = rid;
      btn.classList.add('selected');
      tryCommitMatch();
    };
  });
}

function renderStudentPlayDragDrop(q) {
  const leftItems = q.pairs.map(p => ({ id: p.id, text: p.left }));
  const rightItems = shuffleArray(q.pairs.map(p => ({ id: p.id, text: p.right })));
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text || 'Drag each word to its match')}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:260px; display:block; margin-bottom:16px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <div id="ddZones" style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;"></div>
      <div id="ddPool" style="display:flex; flex-wrap:wrap; gap:10px; min-height:54px; padding:12px; border:1px dashed var(--line); border-radius:6px; margin-bottom:16px;"></div>
      <div class="feedback-line"></div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const zonesEl = document.getElementById('ddZones');
  const poolEl = document.getElementById('ddPool');
  zonesEl.innerHTML = leftItems.map(li => `
    <div class="dd-zone" data-target="${li.id}" style="display:flex; align-items:center; gap:10px; border:1.5px dashed var(--line); border-radius:6px; padding:10px 14px;">
      <span style="font-weight:700; min-width:110px; font-family:'Inter',sans-serif;">${escapeHtml(li.text)}</span>
      <span class="dd-slot" data-target="${li.id}" style="flex:1; min-height:36px; border-radius:4px; background:var(--paper); display:flex; align-items:center; padding:0 10px; font-family:'Inter',sans-serif;"></span>
    </div>
  `).join('');
  poolEl.innerHTML = rightItems.map(ri => `
