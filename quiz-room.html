    <div class="dd-card" data-id="${ri.id}" style="touch-action:none; padding:9px 16px; border:1.5px solid var(--line); border-radius:999px; background:var(--white); cursor:grab; user-select:none; font-family:'Inter',sans-serif; font-size:14px;">${escapeHtml(ri.text)}</div>
  `).join('');

  const matched = {}; // targetId -> true, only permanent CORRECT placements
  let mistakeCount = 0;

  function checkDone() {
    if (Object.keys(matched).length !== q.pairs.length) return;
    const fb = document.querySelector('.feedback-line');
    fb.textContent = mistakeCount === 0
      ? 'All matched correctly!'
      : `All matched — ${mistakeCount} mistake${mistakeCount===1?'':'s'} along the way`;
    fb.classList.add(mistakeCount === 0 ? 'ok' : 'bad');
    studentSession.answers.push({
      qText: q.text || 'Drag & drop matching',
      imageUrl: '',
      selectedText: mistakeCount === 0 ? 'Matched all pairs correctly' : `Matched all pairs, ${mistakeCount} mistake${mistakeCount===1?'':'s'}`,
      correctText: '',
      isCorrect: mistakeCount === 0
    });
    sSet('session:' + studentJoinCode, studentSession);
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').onclick = () => advanceToNext();
  }

  poolEl.querySelectorAll('.dd-card').forEach(card => {
    let dragging = false, offsetX = 0, offsetY = 0;
    card.addEventListener('pointerdown', (e) => {
      if (card.dataset.resolving) return;
      dragging = true;
      card.setPointerCapture(e.pointerId);
      const rect = card.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      card.style.position = 'fixed';
      card.style.zIndex = '1000';
      card.style.width = rect.width + 'px';
      card.style.left = rect.left + 'px';
      card.style.top = rect.top + 'px';
    });
    card.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      card.style.left = (e.clientX - offsetX) + 'px';
      card.style.top = (e.clientY - offsetY) + 'px';
    });
    card.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      card.style.position = '';
      card.style.left = ''; card.style.top = ''; card.style.width = ''; card.style.zIndex = '';
      const dropEl = document.elementFromPoint(e.clientX, e.clientY);
      const zone = dropEl && dropEl.closest ? dropEl.closest('.dd-slot, .dd-zone') : null;
      const targetId = zone ? zone.dataset.target : null;
      if (targetId && !matched[targetId]) {
        const correct = targetId === card.dataset.id;
        const slot = zonesEl.querySelector(`.dd-slot[data-target="${targetId}"]`);
        if (correct) {
          matched[targetId] = true;
          slot.textContent = card.textContent;
          slot.style.border = '2px solid #3F6E56';
          slot.style.background = '#EAF3EE';
          card.remove();
          checkDone();
        } else {
          mistakeCount++;
          playWrongSound();
          card.dataset.resolving = '1';
          slot.textContent = card.textContent;
          slot.style.border = '2px solid #B0413E';
          slot.style.background = '#F7E9E8';
          setTimeout(() => {
            slot.textContent = '';
            slot.style.border = '';
            slot.style.background = '';
            delete card.dataset.resolving;
          }, 700);
        }
      }
    });
  });
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStudentDone() {
  const correct = studentSession.answers.filter(a => a.isCorrect).length;
  const total = studentSession.answers.length;
  const perfect = total > 0 && correct === total;
  studentViewEl.innerHTML = `
    <div class="card jade">
      <div class="score-big">
        <div>Nice work, ${escapeHtml(studentName)}!</div>
        <div class="num">${correct} / ${total}</div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn secondary" id="restartBtn">Start Over</button>
    </div>
  `;
  if (perfect) { playFanfare(); launchConfetti(); }
  document.getElementById('restartBtn').onclick = () => {
    studentStep = 'join';
    studentJoinCode = '';
    renderStudent();
  };
}

// ---------- utils ----------
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

renderAll();
