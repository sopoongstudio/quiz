<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBDF;
    --paper-deep: #E4DFCF;
    --ink: #21283B;
    --ink-soft: #4B5266;
    --plum: #7A2E3B;
    --jade: #3F6E56;
    --gold: #B8933A;
    --coral: #C1592E;
    --line: #D8D2BF;
    --white: #FBFAF6;
    --danger: #B0413E;
    --ok: #3F6E56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }
  .bojagi-strip {
    height: 8px;
    width: 100%;
    background: repeating-linear-gradient(
      90deg,
      var(--plum) 0 14%,
      var(--jade) 14% 28%,
      var(--gold) 28% 42%,
      var(--ink) 42% 56%,
      var(--plum) 56% 70%,
      var(--jade) 70% 84%,
      var(--gold) 84% 100%
    );
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
  }
  h1 span { color: var(--plum); }
  .role-toggle {
    display: flex;
    gap: 8px;
  }
  .role-toggle button {
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all .15s ease;
  }
  .role-toggle button.active {
    background: var(--ink);
    color: var(--white);
  }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 18px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--jade);
    border-radius: 4px 4px 0 0;
  }
  .card.plum::before { background: var(--plum); }
  .card.gold::before { background: var(--gold); }
  .subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .subtabs button {
    flex: 1;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    color: var(--ink-soft);
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }
  .subtabs button.active {
    background: var(--white);
    color: var(--ink);
    border-color: var(--ink);
    font-weight: 700;
  }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  input[type=text], textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    border: none;
    background: var(--ink);
    color: var(--white);
    padding: 11px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }
  .btn.secondary { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn.plum { background: var(--plum); }
  .btn.jade { background: var(--jade); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .q-block {
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--paper);
  }
  .q-block .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .q-block .opt-row input[type=text] { margin-bottom: 0; }
  .q-block .del-q { align-self: flex-end; margin-top: -6px; }
  .quiz-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .quiz-row:last-child { border-bottom: none; }
  .quiz-title { font-weight: 700; }
  .quiz-meta { font-size: 12px; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 20px 0; }
  .code-display {
    text-align: center;
    padding: 24px 0;
  }
  .code-display .code {
    font-family: 'Inter', sans-serif;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 6px;
    color: var(--plum);
  }
  .code-display .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .status-pill {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .status-pill.live { background: var(--jade); color: var(--white); }
  .answer-log-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .answer-log-row:last-child { border-bottom: none; }
  .mark { font-size: 18px; width: 22px; flex-shrink: 0; }
  .mark.correct { color: var(--ok); }
  .mark.wrong { color: var(--danger); }
  .log-text { font-size: 14px; }
  .log-text .qtext { font-weight: 700; margin-bottom: 2px; }
  .log-text .picked { color: var(--ink-soft); }
  .log-text .correct-answer { color: var(--ok); }
  .score-big {
    text-align: center;
    padding: 16px 0;
  }
  .score-big .num {
    font-family: 'Inter', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: var(--jade);
  }
  .student-q-num {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .student-q-text {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 21px;
    margin-bottom: 20px;
    color: var(--ink);
  }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    transition: all .12s ease;
  }
  .opt-btn:hover { border-color: var(--ink); }
  .opt-btn.selected.ok { background: var(--jade); border-color: var(--jade); color: var(--white); }
  .opt-btn.selected.bad { background: var(--danger); border-color: var(--danger); color: var(--white); }
  .opt-btn.reveal-correct { border-color: var(--ok); }
  .opt-btn:disabled { cursor: default; }
  .feedback-line { font-size: 14px; margin-top: 6px; margin-bottom: 16px; min-height: 20px; font-weight: 600; }
  .feedback-line.ok { color: var(--ok); }
  .feedback-line.bad { color: var(--danger); }
  .err { color: var(--danger); font-size: 13px; margin-top: -6px; margin-bottom: 10px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: -8px; margin-bottom: 14px; }
  .join-form { max-width: 320px; margin: 0 auto; }
  .match-wrap { position: relative; display: flex; justify-content: space-between; gap: 32px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .match-pill {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--line); border-radius: 999px;
    padding: 10px 14px; background: var(--white);
    cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif;
    width: 100%; text-align: left;
  }
  .match-pill span:nth-child(2) { flex: 1; overflow-wrap: anywhere; }
  .match-badge {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--white); flex-shrink: 0;
  }
  .match-badge.left-badge { background: var(--jade); }
  .match-badge.right-badge { background: var(--coral); }
  .match-pill.selected { border-color: var(--ink); border-width: 2px; }
  .match-pill.matched-ok { border-color: var(--ok); background: #EAF3EE; cursor: default; }
  .match-pill.matched-bad { border-color: var(--danger); background: #F7E9E8; cursor: default; }
  .match-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--white); flex-shrink: 0; }
  svg.match-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  select.q-type {
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    background: var(--paper);
    color: var(--ink);
  }
  .pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pair-row input[type=text] { margin-bottom: 0; }
</style>
</head>
<body>
<div class="bojagi-strip"></div>
<div class="wrap">
  <header class="top">
    <h1>Quiz <span>Room</span></h1>
    <div class="role-toggle">
      <button id="roleTeacherBtn" class="active">Host</button>
      <button id="roleStudentBtn">Student</button>
    </div>
  </header>

  <div id="teacherView"></div>
  <div id="studentView" style="display:none;"></div>
</div>

<script type="module">
// ---------- Firebase setup ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWWi_Zsl8wblOhIcA97bEVEmp75WyJIWo",
  authDomain: "quiz-b52e1.firebaseapp.com",
  projectId: "quiz-b52e1",
  storageBucket: "quiz-b52e1.firebasestorage.app",
  messagingSenderId: "692181807751",
  appId: "1:692181807751:web:956a8044cc14b32fe2be22"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// ---------- storage helpers (backed by Firestore) ----------
async function sGet(key) {
  try {
    const snap = await getDoc(doc(db, 'storage', key));
    return snap.exists() ? JSON.parse(snap.data().value) : null;
  } catch (e) { return null; }
}
async function sSet(key, val) {
  try {
    await setDoc(doc(db, 'storage', key), { value: JSON.stringify(val) });
    return true;
  } catch (e) { return false; }
}
function uid() { return Math.random().toString(36).slice(2, 9); }
function genCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

// ---------- sound effects (synthesized, no external audio files) ----------
function playWrongSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0, 0.28].forEach((delay, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sawtooth';
      const start = ctx.currentTime + delay;
      o.frequency.setValueAtTime(220 - i*20, start);
      o.frequency.exponentialRampToValueAtTime(90 - i*10, start + 0.26);
      g.gain.setValueAtTime(0.12, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.26);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start + 0.27);
    });
  } catch(e) {}
}
function playFanfare() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      const start = ctx.currentTime + i*0.14;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.18, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start+0.32);
    });
  } catch(e) {}
}
function launchConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.top = '0'; canvas.style.left = '0';
  canvas.style.width = '100%'; canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#7A2E3B', '#3F6E56', '#B8933A', '#21283B'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.4,
    r: 4 + Math.random() * 4,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12
  }));
  let frame = 0;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*2);
      ctx.restore();
    });
    frame++;
    if (frame < 160) requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
}

// Converts a GitHub "blob" file URL to its raw.githubusercontent.com equivalent.
// Leaves any other URL (or empty string) untouched.
function toRawGithubUrl(url) {
  if (!url) return url;
  const m = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
  if (m) {
    return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  }
  return url;
}

// ---------- state ----------
let role = 'teacher';
let hostAccess = false;
let teacherSubtab = 'manage'; // manage | monitor
let editingQuiz = null;
let activeSessionCode = null;
let monitorTimer = null;

let studentStep = 'join'; // join | play | done
let studentSession = null;
let studentQuiz = null;
let studentName = '';
let studentJoinCode = '';
let studentSelected = null;
let studentFeedback = '';
let prefilledCode = '';

const params = new URLSearchParams(window.location.search);
hostAccess = params.has('host');
role = hostAccess ? 'teacher' : 'student';
prefilledCode = params.get('code') || '';
if (!hostAccess) {
  document.querySelector('.role-toggle').style.display = 'none';
}

const teacherViewEl = document.getElementById('teacherView');
const studentViewEl = document.getElementById('studentView');

document.getElementById('roleTeacherBtn').onclick = () => { role='teacher'; renderAll(); };
document.getElementById('roleStudentBtn').onclick = () => { role='student'; renderAll(); };

function renderAll() {
  document.getElementById('roleTeacherBtn').classList.toggle('active', role==='teacher');
  document.getElementById('roleStudentBtn').classList.toggle('active', role==='student');
  teacherViewEl.style.display = role==='teacher' ? 'block' : 'none';
  studentViewEl.style.display = role==='student' ? 'block' : 'none';
  if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; }
  if (role==='teacher') renderTeacher();
  else renderStudent();
}

// ================= TEACHER =================
function newEmptyQuiz() {
  return { id: uid(), title: '', questions: [ newEmptyQuestion() ] };
}
function newEmptyQuestion() {
  return { id: uid(), type: 'mc', text: '', imageUrl: '', options: ['', '', '', ''], correct: 0, pairs: [ newEmptyPair(), newEmptyPair() ] };
}
function newEmptyPair() {
  return { id: uid(), left: '', right: '' };
}

async function renderTeacher() {
  teacherViewEl.innerHTML = `
    <div class="subtabs">
      <button id="tabManage" class="${teacherSubtab==='manage'?'active':''}">Create / Manage Quizzes</button>
      <button id="tabMonitor" class="${teacherSubtab==='monitor'?'active':''}">Live Monitor</button>
    </div>
    <div id="teacherBody"></div>
  `;
  document.getElementById('tabManage').onclick = () => { teacherSubtab='manage'; editingQuiz=null; renderTeacher(); };
  document.getElementById('tabMonitor').onclick = () => { teacherSubtab='monitor'; renderTeacher(); };

  if (teacherSubtab === 'manage') await renderManage();
  else await renderMonitorSetup();
}

async function renderManage() {
  const body = document.getElementById('teacherBody');
  if (editingQuiz) {
    renderQuizEditor(body);
    return;
  }
  const index = (await sGet('quiz-index')) || [];
  body.innerHTML = `
    <div class="card jade">
      <div class="btn-row" style="margin-bottom: 4px;">
        <button class="btn jade" id="newQuizBtn">+ New Quiz</button>
      </div>
    </div>
    <div class="card">
      ${index.length === 0 ? '<div class="empty">No quizzes saved yet.</div>' :
        index.map(q => `
          <div class="quiz-row">
            <div>
              <div class="quiz-title">${escapeHtml(q.title)}</div>
              <div class="quiz-meta">${q.count} question${q.count===1?'':'s'} · ${new Date(q.updatedAt).toLocaleDateString('en-CA')}</div>
            </div>
            <div class="btn-row">
              <button class="btn secondary" data-edit="${q.id}">Edit</button>
              <button class="btn jade" data-start="${q.id}">Start</button>
              <button class="btn secondary" data-del="${q.id}" style="border-color: var(--danger); color: var(--danger);">Delete</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
  document.getElementById('newQuizBtn').onclick = () => { editingQuiz = newEmptyQuiz(); renderTeacher(); };
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = async () => {
      const quiz = await sGet('quiz:' + btn.dataset.edit);
      if (quiz) { editingQuiz = quiz; renderTeacher(); }
    };
  });
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this quiz?')) return;
      const idx = (await sGet('quiz-index')) || [];
      const next = idx.filter(q => q.id !== btn.dataset.del);
      await sSet('quiz-index', next);
      renderTeacher();
    };
  });
  body.querySelectorAll('[data-start]').forEach(btn => {
    btn.onclick = async () => {
      const quiz = await sGet('quiz:' + btn.dataset.start);
      if (!quiz || !quiz.questions.length) { alert('This quiz has no questions.'); return; }
      const code = genCode();
      const session = {
        code, quizId: quiz.id, quizTitle: quiz.title,
        studentName: '', status: 'waiting',
        currentIndex: 0, total: quiz.questions.length,
        answers: [], startedAt: Date.now()
      };
      await sSet('session:' + code, session);
      activeSessionCode = code;
      teacherSubtab = 'monitor';
      renderTeacher();
    };
  });
}

function renderQuizEditor(body) {
  const q = editingQuiz;
  body.innerHTML = `
    <div class="card">
      <label>Quiz Title</label>
      <input type="text" id="quizTitleInput" value="${escapeAttr(q.title)}" placeholder="e.g. Adjectives Practice, Lesson 3">
      <div id="questionsWrap"></div>
      <div class="btn-row">
        <button class="btn secondary" id="addQBtn">+ Add Question</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn jade" id="saveQuizBtn">Save</button>
      <button class="btn secondary" id="cancelEditBtn">Cancel</button>
    </div>
  `;
  const qWrap = document.getElementById('questionsWrap');
  function renderQuestions() {
    qWrap.innerHTML = q.questions.map((qq, i) => `
      <div class="q-block" data-qi="${i}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
          <label style="margin-bottom:0;">Question ${i+1}</label>
          <select class="q-type" data-qi="${i}">
            <option value="mc" ${qq.type!=='match' && qq.type!=='dropdown' ? 'selected':''}>Multiple Choice</option>
            <option value="dropdown" ${qq.type==='dropdown'?'selected':''}>Dropdown</option>
            <option value="match" ${qq.type==='match'?'selected':''}>Matching (draw-a-line)</option>
          </select>
        </div>
        ${qq.type === 'match' ? renderMatchFields(qq, i) : renderMcFields(qq, i)}
        <div class="btn-row">
          <button class="btn secondary del-q" data-qi="${i}" style="border-color: var(--danger); color: var(--danger);">Delete this question</button>
        </div>
      </div>
    `).join('');

    qWrap.querySelectorAll('.q-type').forEach(el => {
      el.onchange = () => { q.questions[+el.dataset.qi].type = el.value; renderQuestions(); };
    });
    qWrap.querySelectorAll('.q-text').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].text = el.value; };
    });
    qWrap.querySelectorAll('.q-image').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].imageUrl = el.value; };
      el.onchange = () => {
        const converted = toRawGithubUrl(el.value.trim());
        q.questions[+el.dataset.qi].imageUrl = converted;
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.opt-text').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].options[+el.dataset.oi] = el.value; };
    });
    qWrap.querySelectorAll('.opt-correct').forEach(el => {
      el.onchange = () => { q.questions[+el.dataset.qi].correct = +el.dataset.oi; };
    });
    qWrap.querySelectorAll('.pair-left').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].pairs[+el.dataset.pi].left = el.value; };
    });
    qWrap.querySelectorAll('.pair-right').forEach(el => {
      el.oninput = () => { q.questions[+el.dataset.qi].pairs[+el.dataset.pi].right = el.value; };
    });
    qWrap.querySelectorAll('.add-pair').forEach(el => {
      el.onclick = () => { q.questions[+el.dataset.qi].pairs.push(newEmptyPair()); renderQuestions(); };
    });
    qWrap.querySelectorAll('.del-pair').forEach(el => {
      el.onclick = () => {
        const qq = q.questions[+el.dataset.qi];
        if (qq.pairs.length <= 2) { alert('A matching question needs at least 2 pairs.'); return; }
        qq.pairs.splice(+el.dataset.pi, 1);
        renderQuestions();
      };
    });
    qWrap.querySelectorAll('.del-q').forEach(el => {
      el.onclick = () => {
        if (q.questions.length <= 1) { alert('A quiz needs at least 1 question.'); return; }
        q.questions.splice(+el.dataset.qi, 1);
        renderQuestions();
      };
    });
  }
  function renderMcFields(qq, i) {
    return `
        <input type="text" class="q-text" data-qi="${i}" value="${escapeAttr(qq.text)}" placeholder="Type the question">
        <label>Image URL (optional — paste the GitHub file link, converts automatically)</label>
        <input type="text" class="q-image" data-qi="${i}" value="${escapeAttr(qq.imageUrl||'')}" placeholder="Paste the github.com/.../blob/... link here (leave blank if none)">
        ${qq.imageUrl ? `<img src="${escapeAttr(qq.imageUrl)}" style="max-width:100%; max-height:180px; display:block; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
        ${qq.options.map((opt, oi) => `
          <div class="opt-row">
            <input type="radio" name="correct-${i}" data-qi="${i}" data-oi="${oi}" class="opt-correct" ${qq.correct===oi?'checked':''}>
            <input type="text" class="opt-text" data-qi="${i}" data-oi="${oi}" value="${escapeAttr(opt)}" placeholder="Option ${oi+1}">
          </div>
        `).join('')}
        <div class="hint">${qq.type==='dropdown' ? 'This will show as a dropdown menu to the student. ' : ''}Use the radio button to mark the correct answer</div>
    `;
  }
  function renderMatchFields(qq, i) {
    return `
        <input type="text" class="q-text" data-qi="${i}" value="${escapeAttr(qq.text)}" placeholder="Instructions (e.g. Match each word to its meaning)">
        ${qq.pairs.map((p, pi) => `
          <div class="pair-row">
            <input type="text" class="pair-left" data-qi="${i}" data-pi="${pi}" value="${escapeAttr(p.left)}" placeholder="Left item">
            <input type="text" class="pair-right" data-qi="${i}" data-pi="${pi}" value="${escapeAttr(p.right)}" placeholder="Right item">
            <button class="btn secondary del-pair" data-qi="${i}" data-pi="${pi}" style="padding:8px 12px; border-color: var(--danger); color: var(--danger);">✕</button>
          </div>
        `).join('')}
        <div class="btn-row" style="margin-bottom: 10px;">
          <button class="btn secondary add-pair" data-qi="${i}">+ Add Pair</button>
        </div>
        <div class="hint">Students will connect each left item to its matching right item</div>
    `;
  }
  renderQuestions();

  document.getElementById('quizTitleInput').oninput = (e) => { q.title = e.target.value; };
  document.getElementById('addQBtn').onclick = () => { q.questions.push(newEmptyQuestion()); renderQuestions(); };
  document.getElementById('cancelEditBtn').onclick = () => { editingQuiz = null; renderTeacher(); };
  document.getElementById('saveQuizBtn').onclick = async () => {
    if (!q.title.trim()) { alert('Please enter a quiz title.'); return; }
    for (const qq of q.questions) {
      if (qq.type === 'match') {
        if (qq.pairs.some(p => !p.left.trim() || !p.right.trim())) {
          alert('Please fill in every pair in each matching question.'); return;
        }
      } else {
        if (!qq.text.trim() || qq.options.some(o => !o.trim())) {
          alert('Please fill in every question and option.'); return;
        }
      }
    }
    await sSet('quiz:' + q.id, q);
    const idx = (await sGet('quiz-index')) || [];
    const existing = idx.findIndex(x => x.id === q.id);
    const entry = { id: q.id, title: q.title, count: q.questions.length, updatedAt: Date.now() };
    if (existing >= 0) idx[existing] = entry; else idx.push(entry);
    await sSet('quiz-index', idx);
    editingQuiz = null;
    renderTeacher();
  };
}

async function renderMonitorSetup() {
  const body = document.getElementById('teacherBody');
  body.innerHTML = `
    <div class="card">
      <label>Load a session by code (starting a quiz brings you here automatically)</label>
      <input type="text" id="monitorCodeInput" value="${activeSessionCode||''}" placeholder="e.g. 4821">
      <button class="btn secondary" id="monitorLoadBtn">Load</button>
    </div>
    <div id="monitorBody"></div>
  `;
  document.getElementById('monitorLoadBtn').onclick = () => {
    activeSessionCode = document.getElementById('monitorCodeInput').value.trim();
    startMonitorPolling();
  };
  if (activeSessionCode) startMonitorPolling();
}

function startMonitorPolling() {
  if (monitorTimer) clearInterval(monitorTimer);
  renderMonitorBody();
  monitorTimer = setInterval(renderMonitorBody, 2000);
}

async function renderMonitorBody() {
  const el = document.getElementById('monitorBody');
  if (!el || !activeSessionCode) return;
  const session = await sGet('session:' + activeSessionCode);
  if (!session) { el.innerHTML = '<div class="card empty">Could not find a session with that code.</div>'; return; }
  const wrongCount = session.answers.filter(a => !a.isCorrect).length;
  const correctCount = session.answers.filter(a => a.isCorrect).length;
  el.innerHTML = `
    <div class="card plum">
      <div class="code-display">
        <div class="label">Give this code to the student</div>
        <div class="code">${activeSessionCode}</div>
      </div>
      <div style="text-align:center; font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; word-break: break-all;">
        Or send this link (code is pre-filled): ${window.location.origin}${window.location.pathname}?code=${activeSessionCode}
      </div>
      <div style="text-align:center; margin-bottom: 4px;">
        <span class="status-pill ${session.status==='active'?'live':''}">${
          session.status==='waiting' ? 'Waiting for student' :
          session.status==='active' ? (session.studentName + ' · in progress') :
          session.status==='closed' ? 'Closed' :
          (session.studentName + ' · done')
        }</span>
      </div>
      <div style="text-align:center; font-size: 13px; color: var(--ink-soft); margin-top: 8px;">
        ${session.quizTitle} · ${correctCount + wrongCount} / ${session.total} answered · Correct ${correctCount} / Wrong ${wrongCount}
      </div>
      ${session.status !== 'closed' ? `
      <div style="text-align:center; margin-top: 14px;">
        <button class="btn secondary" id="endSessionBtn" style="border-color: var(--danger); color: var(--danger);">End Session</button>
      </div>` : ''}
    </div>
    <div class="card ${wrongCount>0?'plum':''}">
      <div style="font-weight:700; margin-bottom: 8px;">Results by question</div>
      ${session.answers.length === 0 ? '<div class="empty">No answers yet.</div>' :
        session.answers.map((a, i) => `
          <div class="answer-log-row">
            <div class="mark ${a.isCorrect?'correct':'wrong'}">${a.isCorrect?'○':'✕'}</div>
            <div class="log-text">
              <div class="qtext">${i+1}. ${escapeHtml(a.qText)}</div>
              ${a.imageUrl ? `<img src="${escapeAttr(a.imageUrl)}" style="max-width:160px; max-height:100px; display:block; margin:4px 0; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
              <div class="picked">Selected: ${escapeHtml(a.selectedText)}</div>
              ${!a.isCorrect ? `<div class="correct-answer">Correct answer: ${escapeHtml(a.correctText)}</div>` : ''}
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
  const endBtn = document.getElementById('endSessionBtn');
  if (endBtn) {
    endBtn.onclick = async () => {
      if (!confirm('End this session? The student link will stop working.')) return;
      session.status = 'closed';
      await sSet('session:' + activeSessionCode, session);
      renderMonitorBody();
    };
  }
}

// ================= STUDENT =================
function renderStudent() {
  if (studentStep === 'join') renderStudentJoin();
  else if (studentStep === 'play') renderStudentPlay();
  else renderStudentDone();
}

function renderStudentJoin() {
  studentViewEl.innerHTML = `
    <div class="card jade join-form">
      <label>Name</label>
      <input type="text" id="stuName" value="${escapeAttr(studentName)}" placeholder="Enter your name">
      <label>Session Code</label>
      <input type="text" id="stuCode" value="${escapeAttr(studentJoinCode || prefilledCode)}" placeholder="Code your teacher gave you">
      <div class="err" id="stuErr" style="display:none;"></div>
      <button class="btn jade" id="stuJoinBtn" style="width:100%;">Start</button>
    </div>
  `;
  document.getElementById('stuJoinBtn').onclick = async () => {
    const name = document.getElementById('stuName').value.trim();
    const code = document.getElementById('stuCode').value.trim();
    const errEl = document.getElementById('stuErr');
    if (!name || !code) { errEl.style.display='block'; errEl.textContent='Please enter both your name and the code.'; return; }
    const session = await sGet('session:' + code);
    if (!session) { errEl.style.display='block'; errEl.textContent='Could not find that code. Please check it.'; return; }
    if (session.status === 'closed') { errEl.style.display='block'; errEl.textContent='This session has ended. Ask your teacher to start a new one.'; return; }
    if (session.status === 'done') { errEl.style.display='block'; errEl.textContent='This session has already been completed. Ask your teacher to start a new one.'; return; }
    const quiz = await sGet('quiz:' + session.quizId);
    if (!quiz) { errEl.style.display='block'; errEl.textContent='Could not load the quiz.'; return; }
    session.studentName = name;
    session.status = 'active';
    await sSet('session:' + code, session);
    studentName = name;
    studentJoinCode = code;
    studentSession = session;
    studentQuiz = quiz;
    studentSelected = null;
    studentFeedback = '';
    studentStep = 'play';
    renderStudent();
  };
}

function renderStudentPlay() {
  const q = studentQuiz.questions[studentSession.currentIndex];
  if (q.type === 'match') { renderStudentPlayMatch(q); return; }
  if (q.type === 'dropdown') { renderStudentPlayDropdown(q); return; }
  renderStudentPlayMC(q);
}

function advanceToNext() {
  studentSession.currentIndex += 1;
  studentSelected = null;
  studentFeedback = '';
  if (studentSession.currentIndex >= studentQuiz.questions.length) {
    studentSession.status = 'done';
  }
  sSet('session:' + studentJoinCode, studentSession).then(() => {
    studentStep = studentSession.status === 'done' ? 'done' : 'play';
    renderStudent();
  });
}

function renderStudentPlayMC(q) {
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text)}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:280px; display:block; margin-bottom:18px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <div id="optsWrap"></div>
      <div class="feedback-line ${studentFeedback && studentSelected===q.correct?'ok':studentFeedback?'bad':''}">${studentFeedback}</div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  optsWrap.innerHTML = q.options.map((opt, oi) => `
    <button class="opt-btn" data-oi="${oi}">${escapeHtml(opt)}</button>
  `).join('');
  optsWrap.querySelectorAll('.opt-btn').forEach(btn => {
    btn.onclick = async () => {
      if (studentSelected !== null) return;
      const oi = +btn.dataset.oi;
      studentSelected = oi;
      const isCorrect = oi === q.correct;
      studentFeedback = isCorrect ? 'Correct!' : "Not quite — you'll get it next time!";
      if (!isCorrect) playWrongSound();
      optsWrap.querySelectorAll('.opt-btn').forEach((b2, i2) => {
        b2.disabled = true;
        if (i2 === oi) b2.classList.add('selected', isCorrect ? 'ok' : 'bad');
        if (i2 === q.correct && !isCorrect) b2.classList.add('reveal-correct');
      });
      studentSession.answers.push({
        qText: q.text,
        imageUrl: q.imageUrl || '',
        selectedText: q.options[oi],
        correctText: q.options[q.correct],
        isCorrect
      });
      await sSet('session:' + studentJoinCode, studentSession);
      renderStudent();
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').onclick = () => advanceToNext();
    };
  });
}

function renderStudentPlayDropdown(q) {
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text)}</div>
      ${q.imageUrl ? `<img src="${escapeAttr(q.imageUrl)}" style="max-width:100%; max-height:280px; display:block; margin-bottom:18px; border:1px solid var(--line); border-radius:4px;" onerror="this.style.display='none'">` : ''}
      <select id="ddSelect" style="width:100%; font-family:'Inter',sans-serif; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:4px; background:var(--white); color:var(--ink); margin-bottom:14px;">
        <option value="" disabled selected>Choose an answer…</option>
        ${q.options.map((opt, oi) => `<option value="${oi}">${escapeHtml(opt)}</option>`).join('')}
      </select>
      <button class="btn jade" id="ddSubmitBtn">Submit</button>
      <div class="feedback-line"></div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  document.getElementById('ddSubmitBtn').onclick = async () => {
    const sel = document.getElementById('ddSelect');
    if (sel.value === '') return;
    const oi = +sel.value;
    const isCorrect = oi === q.correct;
    const feedbackEl = document.querySelector('.feedback-line');
    feedbackEl.textContent = isCorrect ? 'Correct!' : "Not quite — you'll get it next time!";
    feedbackEl.classList.add(isCorrect ? 'ok' : 'bad');
    if (!isCorrect) playWrongSound();
    sel.disabled = true;
    document.getElementById('ddSubmitBtn').disabled = true;
    studentSession.answers.push({
      qText: q.text,
      imageUrl: q.imageUrl || '',
      selectedText: q.options[oi],
      correctText: q.options[q.correct],
      isCorrect
    });
    await sSet('session:' + studentJoinCode, studentSession);
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').onclick = () => advanceToNext();
  };
}

function renderStudentPlayMatch(q) {
  const leftItems = q.pairs.map((p, i) => ({ id: p.id, text: p.left, num: i+1 }));
  const rightItems = shuffleArray(q.pairs.map(p => ({ id: p.id, text: p.right })));
  const letters = 'ABCDEFGHIJKLMNOP';
  studentViewEl.innerHTML = `
    <div class="card">
      <div class="student-q-num">${studentSession.currentIndex+1} / ${studentQuiz.questions.length}</div>
      <div class="student-q-text">${escapeHtml(q.text || 'Match each item on the left to its pair on the right')}</div>
      <div class="match-wrap" id="matchWrap">
        <svg class="match-svg" id="matchSvg"></svg>
        <div class="match-col">
          ${leftItems.map(li => `
            <button class="match-pill" data-side="left" data-id="${li.id}">
              <span class="match-badge left-badge">${li.num}</span>
              <span>${escapeHtml(li.text)}</span>
              <span class="match-dot" data-dot="left-${li.id}"></span>
            </button>
          `).join('')}
        </div>
        <div class="match-col">
          ${rightItems.map((ri, idx) => `
            <button class="match-pill" data-side="right" data-id="${ri.id}">
              <span class="match-dot" data-dot="right-${ri.id}"></span>
              <span class="match-badge right-badge">${letters[idx]}</span>
              <span>${escapeHtml(ri.text)}</span>
            </button>
          `).join('')}
        </div>
      </div>
      <div class="feedback-line"></div>
      <button class="btn jade" id="nextBtn" style="display:none;">Next Question</button>
    </div>
  `;
  const wrap = document.getElementById('matchWrap');
  const svg = document.getElementById('matchSvg');
  let selectedLeftId = null;
  const matched = {}; // leftId -> { rightId, correct }

  function drawLine(leftId, rightId, correct) {
    const wrapRect = wrap.getBoundingClientRect();
    const dotL = wrap.querySelector(`[data-dot="left-${leftId}"]`).getBoundingClientRect();
    const dotR = wrap.querySelector(`[data-dot="right-${rightId}"]`).getBoundingClientRect();
    const x1 = dotL.left + dotL.width/2 - wrapRect.left;
    const y1 = dotL.top + dotL.height/2 - wrapRect.top;
    const x2 = dotR.left + dotR.width/2 - wrapRect.left;
    const y2 = dotR.top + dotR.height/2 - wrapRect.top;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', correct ? '#3F6E56' : '#B0413E');
    line.setAttribute('stroke-width', '2.5');
    svg.appendChild(line);
  }

  function checkDone() {
    if (Object.keys(matched).length !== q.pairs.length) return;
    const correctCount = Object.values(matched).filter(m => m.correct).length;
    const allCorrect = correctCount === q.pairs.length;
    document.querySelector('.feedback-line').textContent =
      `Matched ${correctCount}/${q.pairs.length} correctly`;
    document.querySelector('.feedback-line').classList.add(allCorrect ? 'ok' : 'bad');
    const wrongDetails = q.pairs
      .filter(p => !matched[p.id].correct)
      .map(p => {
        const gotRight = q.pairs.find(x => x.id === matched[p.id].rightId);
        return `${p.left} → ${gotRight ? gotRight.right : '?'} (correct: ${p.right})`;
      });
    studentSession.answers.push({
      qText: q.text || 'Matching question',
      imageUrl: '',
      selectedText: `Matched ${correctCount}/${q.pairs.length} pairs`,
      correctText: wrongDetails.join('; '),
      isCorrect: allCorrect
    });
    sSet('session:' + studentJoinCode, studentSession);
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').onclick = () => advanceToNext();
  }

  wrap.querySelectorAll('.match-pill[data-side="left"]').forEach(btn => {
    btn.onclick = () => {
      if (matched[btn.dataset.id]) return;
      wrap.querySelectorAll('.match-pill[data-side="left"]').forEach(b => b.classList.remove('selected'));
      selectedLeftId = btn.dataset.id;
      btn.classList.add('selected');
    };
  });
  wrap.querySelectorAll('.match-pill[data-side="right"]').forEach(btn => {
    btn.onclick = () => {
      const rid = btn.dataset.id;
      if (selectedLeftId === null) return;
      if (Object.values(matched).some(m => m.rightId === rid)) return;
      const lid = selectedLeftId;
      if (matched[lid]) return;
      const correct = lid === rid;
      matched[lid] = { rightId: rid, correct };
      if (!correct) playWrongSound();
      const leftBtn = wrap.querySelector(`.match-pill[data-side="left"][data-id="${lid}"]`);
      leftBtn.classList.remove('selected');
      leftBtn.classList.add(correct ? 'matched-ok' : 'matched-bad');
      btn.classList.add(correct ? 'matched-ok' : 'matched-bad');
      drawLine(lid, rid, correct);
      selectedLeftId = null;
      checkDone();
    };
  });
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStudentDone() {
  const correct = studentSession.answers.filter(a => a.isCorrect).length;
  const total = studentSession.answers.length;
  const perfect = total > 0 && correct === total;
  studentViewEl.innerHTML = `
    <div class="card jade">
      <div class="score-big">
        <div>Nice work, ${escapeHtml(studentName)}!</div>
        <div class="num">${correct} / ${total}</div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn secondary" id="restartBtn">Start Over</button>
    </div>
  `;
  if (perfect) { playFanfare(); launchConfetti(); }
  document.getElementById('restartBtn').onclick = () => {
    studentStep = 'join';
    studentJoinCode = '';
    renderStudent();
  };
}

// ---------- utils ----------
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

renderAll();
